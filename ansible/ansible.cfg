[defaults]
inventory = inventory/
roles_path = roles
collections_path = .collections
remote_user = root
private_key_file = ../proxmox-pxe/secrets/automation_ed25519
vault_password_file = scripts/vault-pass.sh
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml

[ssh_connection]
# The automation key only: skip the Secretive agent (no Touch ID prompt per connection).
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -o IdentityAgent=none
pipelining = True
