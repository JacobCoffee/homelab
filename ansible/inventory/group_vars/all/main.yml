# Site-wide settings. Secrets live in vault.yml (ansible-vault, Keychain password).
site_code: hn
domain_int: int.z7x.org
timezone: America/Chicago

house_lan_cidr: 192.168.1.0/24
house_gateway: 192.168.1.1

# Lab zones behind OPNsense: VLAN id -> subnet, firewall at .1.
# Per zone: .2-.99 static, .100-.199 DHCP, .200-.250 reserved (k8s LoadBalancer IPs).
lab_zones:
  - { name: int, vlan: 10, cidr: 10.10.10.0/24, gateway: 10.10.10.1, domain: int.z7x.org,     dhcp: [10.10.10.100, 10.10.10.199] }
  - { name: dmz, vlan: 20, cidr: 10.10.20.0/24, gateway: 10.10.20.1, domain: dmz.z7x.org,     dhcp: [10.10.20.100, 10.10.20.199] }
  - { name: k8s, vlan: 30, cidr: 10.10.30.0/24, gateway: 10.10.30.1, domain: k8s.int.z7x.org, dhcp: [10.10.30.100, 10.10.30.199] }

# Lab DNS (AdGuard Home, hndns01): every zone's DHCP hands it out; it asks OPNsense's Unbound.
lab_dns: 10.10.10.53

# Shared SSH material produced by proxmox-pxe/build.sh
automation_ssh_pubkey: "{{ lookup('file', playbook_dir ~ '/../../proxmox-pxe/secrets/automation_ed25519.pub') }}"
