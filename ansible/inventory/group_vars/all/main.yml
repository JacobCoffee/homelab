# Site-wide settings. Secrets live in vault.yml (ansible-vault, Keychain password).
site_code: hn
domain_int: int.z7x.org
# Public zone (Cloudflare). Tailnet devices resolve it through AdGuard (split DNS), which adds
# internal-gateway services and <host>.<domain_tailnet> names for tagged tailnet nodes.
domain: z7x.org
domain_tailnet: internal.z7x.org
timezone: America/Chicago

house_lan_cidr: 192.168.1.0/24
house_gateway: 192.168.1.1

# Lab zones behind OPNsense, firewall at .1. Each zone is a Proxmox SDN VXLAN network (vnet)
# spanning every node (id = the VLAN id, ready for a real trunk once the switches arrive).
# Per zone: .2-.99 static, .100-.199 DHCP, .200-.250 reserved (k8s LoadBalancer IPs).
lab_zones:
  - { name: int, vlan: 10, vnet: vxint, cidr: 10.10.10.0/24, gateway: 10.10.10.1, domain: int.z7x.org,     dhcp: [10.10.10.100, 10.10.10.199] }
  - { name: dmz, vlan: 20, vnet: vxdmz, cidr: 10.10.20.0/24, gateway: 10.10.20.1, domain: dmz.z7x.org,     dhcp: [10.10.20.100, 10.10.20.199] }
  - { name: k8s, vlan: 30, vnet: vxk8s, cidr: 10.10.30.0/24, gateway: 10.10.30.1, domain: k8s.int.z7x.org, dhcp: [10.10.30.100, 10.10.30.199] }

# VXLAN adds 50 bytes to a 1500-byte house LAN; every lab NIC uses this (DHCP option 26).
lab_mtu: 1450

# Alloy's syslog listener (kubernetes/apps/observability/alloy, LoadBalancer Service pinned via
# Cilium LB-IPAM in the K8S zone's 10.10.30.200-250 range -- .200/.201 are the two Envoy
# Gateways). Proxmox (pve_syslog role) and OPNsense (roles/opnsense/tasks/syslog.yml) both
# forward here.
observability_syslog_target: 10.10.30.210
observability_syslog_port: 514

# Lab DNS (AdGuard Home, hndns01): INT and K8S DHCP hand it out; it asks OPNsense's Unbound.
lab_dns: 10.10.10.53

# Talos Kubernetes on the K8S zone. Every node runs the control plane and workloads.
# MACs are fixed (locally administered) so OPNsense can reserve each IP before first boot.
k8s_cluster_name: homelab
k8s_vip: 10.10.30.10   # Kubernetes API, floated between the nodes by Talos
k8s_nodes:
  - { name: hnk8s01, host: hnhv01, vmid: 201, ip: 10.10.30.11, mac: "02:10:10:30:00:11", cores: 4, memory: 12288, disk_gb: 64 }
  - { name: hnk8s02, host: hnhv01, vmid: 202, ip: 10.10.30.12, mac: "02:10:10:30:00:12", cores: 4, memory: 12288, disk_gb: 64 }
  - { name: hnk8s03, host: hnhv02, vmid: 203, ip: 10.10.30.13, mac: "02:10:10:30:00:13", cores: 4, memory: 8192, disk_gb: 64 }

# Home Assistant OS on the node with the Aeotec Z-Wave/Zigbee stick (USB passthrough).
home_assistant: { name: hnha01, host: hnhv02, vmid: 301, ip: 10.10.10.20, mac: "02:10:10:10:00:20", usb: ["10c4:ea60"] }

# Temporary media NFS server on the K8S zone (ansible/roles/media_nfs); exports /srv/media to
# pods until a NAS takes over (see kubernetes/flux/cluster/cluster-settings.yaml).
media_nfs: { name: hnnfs01, host: hnhv01, vmid: 401, ip: 10.10.30.20, mac: "02:10:10:30:00:20" }

# Fixed-address DHCP leases OPNsense hands out (name, mac, ip, zone).
lab_dhcp_hosts: >-
  {{ k8s_nodes | map('combine', {'zone': 'k8s'}) | list
     + [home_assistant | combine({'zone': 'int'})]
     + [media_nfs | combine({'zone': 'k8s'})] }}

# Shared SSH material produced by proxmox-pxe/build.sh
automation_ssh_pubkey: "{{ lookup('file', playbook_dir ~ '/../../proxmox-pxe/secrets/automation_ed25519.pub') }}"
