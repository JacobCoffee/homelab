opnsense_version: "26.7"
opnsense_mirror: https://pkg.opnsense.org/releases
opnsense_image: "OPNsense-{{ opnsense_version }}-nano-amd64.img"

# This node's firewall and its CARP peer (firewalls in group_vars: exactly two). Not
# opnsense_fw: firmware.yml registers that name.
opnsense_node: "{{ firewalls | selectattr('host', 'equalto', inventory_hostname) | first }}"
opnsense_peer: "{{ firewalls | rejectattr('host', 'equalto', inventory_hostname) | first }}"
opnsense_node_index: "{{ (firewalls | map(attribute='host') | list).index(inventory_hostname) }}"
opnsense_vmid: "{{ opnsense_node.vmid }}"
opnsense_hostname: "{{ opnsense_node.name }}"
opnsense_domain: "{{ domain_int }}"
opnsense_timezone: "{{ timezone }}"

opnsense_storage: vmdata
opnsense_cores: 2
opnsense_memory: "{{ opnsense_node.memory | default(4096) }}"
opnsense_disk_size: 32G
opnsense_workdir: /var/lib/vz/opnsense

# net0 = WAN on the house LAN; net1.. = one NIC per lab zone, each on that zone's SDN vnet;
# the last NIC is the pfsync link to the peer.
# Per zone: ip = this firewall's own address, vip = the shared CARP gateway (VHID = zone VLAN),
# dhcp_start/dhcp_end = this firewall's half of the zone's pool (first firewall: lower half).
opnsense_wan_bridge: vmbr0
opnsense_wan_if: vtnet0
opnsense_zones: >-
  {%- set out = [] -%}
  {%- for z in lab_zones -%}
  {%- set net = z.cidr.split('/')[0].rsplit('.', 1)[0] -%}
  {%- set lo = z.dhcp[0].rsplit('.', 1)[1] | int -%}
  {%- set hi = z.dhcp[1].rsplit('.', 1)[1] | int -%}
  {%- set half = (hi - lo + 1) // 2 -%}
  {%- set first = opnsense_node_index | int == 0 -%}
  {%- set _ = out.append({
        'name': 'lan' if loop.first else 'opt' ~ (loop.index - 1),
        'descr': z.name | upper,
        'if': 'vtnet' ~ loop.index,
        'bridge': z.vnet,
        'ip': net ~ '.' ~ opnsense_node.lan_host,
        'vip': z.gateway,
        'vhid': z.vlan,
        'prefix': z.cidr.split('/')[1] | int,
        'cidr': z.cidr,
        'domain': z.domain,
        'dhcp_start': net ~ '.' ~ (lo if first else lo + half),
        'dhcp_end': net ~ '.' ~ (lo + half - 1 if first else hi)}) -%}
  {%- endfor -%}
  {{ out }}
opnsense_sync_net: "{{ firewall_sync.cidr.split('/')[0].rsplit('.', 1)[0] }}"
opnsense_sync_if:
  name: "opt{{ lab_zones | length }}"
  descr: PFSYNC
  if: "vtnet{{ lab_zones | length + 1 }}"
  bridge: "{{ firewall_sync.vnet }}"
  ip: "{{ opnsense_sync_net }}.{{ opnsense_node.lan_host }}"
  prefix: "{{ firewall_sync.cidr.split('/')[1] | int }}"
  cidr: "{{ firewall_sync.cidr }}"
opnsense_peer_sync_ip: "{{ opnsense_sync_net }}.{{ opnsense_peer.lan_host }}"
opnsense_ifaces: "{{ opnsense_zones + [opnsense_sync_if] }}"

# CARP: one shared password for every VHID; WAN VHID (the lab zones use their VLAN id).
opnsense_carp_password: "{{ vault_opnsense_carp_password }}"
opnsense_wan_vhid: 250
# The second firewall answers DHCP only after this many seconds, so clients take the first
# one's offer while it is up (docs.opnsense.org/manual/dnsmasq.html, HA with split pools).
opnsense_dhcp_reply_delay: "{{ '' if opnsense_node_index | int == 0 else '3' }}"

# WebGUI/SSH/API reachable on WAN from these sources (the house LAN, where the Mac is).
opnsense_mgmt_sources:
  - "{{ house_lan_cidr }}"

opnsense_root_ssh_key: "{{ automation_ssh_pubkey }}"
opnsense_root_password: "{{ vault_opnsense_root_password }}"
opnsense_api_key: "{{ vault_opnsense_api_key }}"
opnsense_api_secret: "{{ vault_opnsense_api_secret }}"

# Install pending updates within the release series on every run (reboots OPNsense when
# the update requires it). Plugins can't be installed on an out-of-date box.
opnsense_update: true

# os-sso (github.com/MaximeWewer/os-sso): a third-party OIDC server type for System > Access >
# Servers, not in the official OPNsense plugin repo, so it's `pkg add`-ed from a GitHub release
# over SSH instead of `/api/core/firmware/install/...` (tasks/sso.yml). The release has no
# separate checksums file; GitHub computes and publishes a sha256 digest per asset
# (`gh api repos/MaximeWewer/os-sso/releases/latest`) -- bump the version and both hashes
# together, they're verified against the FreeBSD-14/15 packages of that exact release.
# renovate: datasource=github-releases depName=MaximeWewer/os-sso extractVersion=^v(?<version>.+)$
opnsense_sso_version: "2026.11.1"
opnsense_sso_sha256:
  "14": e0548e5988729ea9a0c2e2b5b59ad534eaa66cb48bdbbb413b6cace9273391b9
  "15": 9b718ac55e4bd0a75b82fa7544cf35099884e73d28aee4d256c01d84148c32d5

# Pocket ID (https://id.z7x.org, scripts/pocket-id.py) as an OIDC login for the WebGUI. os-sso's
# own provider config lives in core's <system><authserver>, which (like LDAP/RADIUS before it)
# has no REST API -- only the legacy System > Access > Servers form -- so it's set directly
# through OPNsense's own Config class over SSH (templates/sso-authserver.php.j2), the same way
# os-sso's own lab scripts (test/vagrant/add_authserver.php) do it.
#
# No Base URL (sso_base_url left empty): with no config sync, a single fixed value can't be
# correct for both firewalls, and a value pinned to one firewall's own address breaks the login
# round-trip from any OTHER address (CARP VIP, the peer's own address, a hostname) -- the
# session cookie set at /login is bound to whichever host the browser used, but the callback
# would land on the pinned Base URL's host instead, arrive with no session, and fail ("missing
# provider"; reproduced with a real browser hitting the VIP). Left empty, os-sso's own
# SiteUrl::detect() builds it from the request Host instead, but ONLY when that Host matches
# this firewall's own hostname/FQDN/althostnames or SERVER_ADDR (the real local socket address,
# which is genuinely the CARP VIP when this box is master) -- never an arbitrary client-supplied
# value, so it's safe with no reverse proxy or port-forward in front of the WebGUI (there isn't
# one here). That keeps /login and /callback on the same origin whichever address was used.
opnsense_sso_provider_name: opnsense
opnsense_sso_issuer: https://id.z7x.org
opnsense_sso_client_id: opnsense
opnsense_sso_client_secret: "{{ vault_pocket_id_opnsense_secret }}"
opnsense_sso_scopes: "openid,email,profile,groups"
opnsense_sso_username_claim: preferred_username
# Access gate (IdP group name) and the explicit operator mapping os-sso requires for a
# privilege-bearing OPNsense group (docs/configuration.md "Group mapping"; the 1:1 name
# fallback refuses any group carrying firewall privileges, `admins` included).
opnsense_sso_required_groups: lab-admins
opnsense_sso_group_map: "lab-admins:admins"
opnsense_sso_button_label: "Pocket ID"
