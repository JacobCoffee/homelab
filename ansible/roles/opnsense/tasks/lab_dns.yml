# DHCP options per zone, plus the house LAN's way into AdGuard through the WAN CARP address.
# Every zone: MTU (option 26) = lab_mtu, since lab networks are VXLAN; router (option 3) = the
# zone's CARP .1 (Dnsmasq would hand out this firewall's own address).
# INT and K8S: DNS (option 6) = AdGuard (lab_dns). DMZ gets its CARP .1 (Unbound) as DNS so it
# stays fully cut off from INT.
- name: DHCP | wanted options (zone, option, value)
  ansible.builtin.set_fact:
    opnsense_dhcp_wanted: >-
      {%- set out = [] -%}
      {%- for z in opnsense_zones -%}
      {%- set _ = out.append({'zone': z, 'option': '26', 'value': lab_mtu | string, 'descr': 'Lab MTU (' ~ z.descr ~ ')'}) -%}
      {%- set _ = out.append({'zone': z, 'option': '3', 'value': z.vip, 'descr': 'CARP gateway (' ~ z.descr ~ ')'}) -%}
      {%- if z.descr != 'DMZ' -%}
      {%- set _ = out.append({'zone': z, 'option': '6', 'value': lab_dns, 'descr': 'Lab DNS: AdGuard Home (' ~ z.descr ~ ')'}) -%}
      {%- else -%}
      {%- set _ = out.append({'zone': z, 'option': '6', 'value': z.vip, 'descr': 'DNS: CARP gateway (' ~ z.descr ~ ')'}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: DHCP | existing options
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/dnsmasq/settings/search_option"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
  delegate_to: localhost
  register: opnsense_dhcp_options

# Keyed on (interface, option): the option's interface field takes a single interface.
- name: DHCP | set options
  vars:
    existing: >-
      {{ opnsense_dhcp_options.json.rows | selectattr('interface', 'equalto', item.zone.name)
         | selectattr('option', 'equalto', item.option) | list }}
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/dnsmasq/settings/{{ 'set_option/' ~ existing[0].uuid if existing else 'add_option' }}"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    method: POST
    body_format: json
    body:
      option:
        type: set
        option: "{{ item.option }}"
        interface: "{{ item.zone.name }}"
        value: "{{ item.value }}"
        description: "{{ item.descr }}"
  delegate_to: localhost
  loop: "{{ opnsense_dhcp_wanted }}"
  loop_control:
    label: "{{ item.zone.descr }} option {{ item.option }} = {{ item.value }}"
  register: opnsense_dhcp_option_set
  when: not existing or existing[0].value != item.value or existing[0].description != item.descr
  changed_when: opnsense_dhcp_option_set.json.result == "saved"
  failed_when: opnsense_dhcp_option_set.json.result is not defined or opnsense_dhcp_option_set.json.result == "failed"

- name: DHCP | reconfigure Dnsmasq
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/dnsmasq/service/reconfigure"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    method: POST
  delegate_to: localhost
  when: opnsense_dhcp_option_set is changed
  changed_when: true

- name: Lab DNS | existing port forwards
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/firewall/d_nat/search_rule"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
  delegate_to: localhost
  register: opnsense_dnat_rules

# "pass": "pass" makes OPNsense keep a matching WAN pass rule itself. Bound to the WAN CARP
# address, so it follows the master.
- name: Lab DNS | forward WAN CARP address port 53 to AdGuard
  vars:
    existing: "{{ opnsense_dnat_rules.json.rows | selectattr('descr', 'equalto', 'Lab DNS: WAN 53 to AdGuard') | list }}"
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/firewall/d_nat/{{ 'set_rule/' ~ existing[0].uuid if existing else 'add_rule' }}"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    method: POST
    body_format: json
    body:
      rule:
        interface: wan
        ipprotocol: inet
        protocol: TCP/UDP
        destination: {network: "{{ firewall_wan_vip }}", port: "53"}
        target: "{{ lab_dns }}"
        local-port: "53"
        descr: "Lab DNS: WAN 53 to AdGuard"
        pass: pass
  delegate_to: localhost
  register: opnsense_dnat_add
  when: >-
    not existing or existing[0]['destination.network'] != firewall_wan_vip or existing[0].target != lab_dns
  changed_when: opnsense_dnat_add.json.result == "saved"
  failed_when: opnsense_dnat_add.json.result is not defined or opnsense_dnat_add.json.result == "failed"

- name: Lab DNS | apply firewall/NAT changes
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/firewall/filter/apply"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    method: POST
  delegate_to: localhost
  when: opnsense_dnat_add is changed
  changed_when: true

# Fixed leases (lab_dhcp_hosts), e.g. Talos nodes that must come up on their final IP even
# from the installer ISO. Keyed on MAC.
- name: DHCP | existing host reservations
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/dnsmasq/settings/search_host"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
  delegate_to: localhost
  register: opnsense_dhcp_hosts

- name: DHCP | reserve {{ lab_dhcp_hosts | map(attribute='name') | join(', ') }}
  vars:
    zone: "{{ lab_zones | selectattr('name', 'equalto', item.zone) | first }}"
    existing: "{{ opnsense_dhcp_hosts.json.rows | selectattr('hwaddr', 'equalto', item.mac | lower) | list }}"
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/dnsmasq/settings/{{ 'set_host/' ~ existing[0].uuid if existing else 'add_host' }}"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    method: POST
    body_format: json
    body:
      host:
        host: "{{ item.name }}"
        domain: "{{ zone.domain }}"
        ip: "{{ item.ip }}"
        hwaddr: "{{ item.mac | lower }}"
        descr: ansible-managed
  delegate_to: localhost
  loop: "{{ lab_dhcp_hosts }}"
  loop_control:
    label: "{{ item.name }} {{ item.mac }} -> {{ item.ip }}"
  register: opnsense_dhcp_host_set
  when: >-
    not existing or existing[0].host != item.name or existing[0].ip != item.ip or
    existing[0].domain != zone.domain
  changed_when: opnsense_dhcp_host_set.json.result == "saved"
  failed_when: opnsense_dhcp_host_set.json.result is not defined or opnsense_dhcp_host_set.json.result == "failed"

- name: DHCP | reconfigure Dnsmasq for the reservations
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/dnsmasq/service/reconfigure"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    method: POST
  delegate_to: localhost
  when: opnsense_dhcp_host_set is changed
  changed_when: true
