# DHCP options per zone, plus the house LAN's way into AdGuard through the WAN.
# Every zone: MTU (option 26) = lab_mtu, since lab networks are VXLAN.
# INT and K8S: DNS (option 6) = AdGuard. DMZ keeps its gateway (Unbound) as DNS so it stays
# fully cut off from INT.
- name: DHCP | wanted options (zone, option, value)
  ansible.builtin.set_fact:
    opnsense_dhcp_wanted: >-
      {%- set out = [] -%}
      {%- for z in opnsense_zones -%}
      {%- set _ = out.append({'zone': z, 'option': '26', 'value': lab_mtu | string, 'descr': 'Lab MTU (' ~ z.descr ~ ')'}) -%}
      {%- if z.descr != 'DMZ' -%}
      {%- set _ = out.append({'zone': z, 'option': '6', 'value': lab_dns, 'descr': 'Lab DNS: AdGuard Home (' ~ z.descr ~ ')'}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: DHCP | existing options
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/dnsmasq/settings/search_option"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
  delegate_to: localhost
  register: opnsense_dhcp_options

# Keyed on (interface, option): the option's interface field takes a single interface.
- name: DHCP | set options
  vars:
    existing: >-
      {{ opnsense_dhcp_options.json.rows | selectattr('interface', 'equalto', item.zone.name)
         | selectattr('option', 'equalto', item.option) | list }}
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/dnsmasq/settings/{{ 'set_option/' ~ existing[0].uuid if existing else 'add_option' }}"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    method: POST
    body_format: json
    body:
      option:
        type: set
        option: "{{ item.option }}"
        interface: "{{ item.zone.name }}"
        value: "{{ item.value }}"
        description: "{{ item.descr }}"
  delegate_to: localhost
  loop: "{{ opnsense_dhcp_wanted }}"
  loop_control:
    label: "{{ item.zone.descr }} option {{ item.option }} = {{ item.value }}"
  register: opnsense_dhcp_option_set
  when: not existing or existing[0].value != item.value or existing[0].description != item.descr
  changed_when: opnsense_dhcp_option_set.json.result == "saved"
  failed_when: opnsense_dhcp_option_set.json.result is not defined or opnsense_dhcp_option_set.json.result == "failed"

- name: DHCP | reconfigure Dnsmasq
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/dnsmasq/service/reconfigure"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    method: POST
  delegate_to: localhost
  when: opnsense_dhcp_option_set is changed
  changed_when: true

- name: Lab DNS | existing port forwards
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/firewall/d_nat/search_rule"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
  delegate_to: localhost
  register: opnsense_dnat_rules

# "pass": "pass" makes OPNsense keep a matching WAN pass rule itself.
- name: Lab DNS | forward WAN port 53 to AdGuard
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/firewall/d_nat/add_rule"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    method: POST
    body_format: json
    body:
      rule:
        interface: wan
        ipprotocol: inet
        protocol: TCP/UDP
        destination: {network: wanip, port: "53"}
        target: "{{ lab_dns }}"
        local-port: "53"
        descr: "Lab DNS: WAN 53 to AdGuard"
        pass: pass
  delegate_to: localhost
  register: opnsense_dnat_add
  when: >-
    opnsense_dnat_rules.json.rows | selectattr('descr', 'equalto', 'Lab DNS: WAN 53 to AdGuard')
    | list | length == 0
  changed_when: opnsense_dnat_add.json.result == "saved"
  failed_when: opnsense_dnat_add.json.result is not defined or opnsense_dnat_add.json.result == "failed"

- name: Lab DNS | apply firewall/NAT changes
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/firewall/filter/apply"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    method: POST
  delegate_to: localhost
  when: opnsense_dnat_add is changed
  changed_when: true
