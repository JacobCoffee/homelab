# OPNsense HA (docs.opnsense.org/manual/hacarp.html), set on both firewalls through the API:
# - CARP addresses: .1 in every lab zone (VHID = zone VLAN) and firewall_wan_vip on the WAN.
#   The firewall with the lowest advskew is master; preemption keeps every VIP on one box.
# - pfsync over its own interface, so connection states survive a failover.
# - Outbound NAT (hybrid) from the lab zones to the WAN CARP address, so the states stay valid
#   on the other firewall.
# No XMLRPC config sync: Ansible configures both firewalls, each with its own addresses.
- name: HA | wanted CARP addresses
  ansible.builtin.set_fact:
    opnsense_vips_wanted: >-
      {%- set out = [] -%}
      {%- for z in opnsense_zones -%}
      {%- set _ = out.append({'interface': z.name, 'network': z.vip ~ '/' ~ z.prefix, 'vhid': z.vhid | string,
                               'descr': 'CARP ' ~ z.descr}) -%}
      {%- endfor -%}
      {%- set _ = out.append({'interface': 'wan', 'network': firewall_wan_vip ~ '/' ~ house_lan_cidr.split('/')[1],
                               'vhid': opnsense_wan_vhid | string, 'descr': 'CARP WAN'}) -%}
      {{ out }}

- name: HA | current virtual IPs
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/interfaces/vip_settings/search_item"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
  delegate_to: localhost
  register: opnsense_vips

- name: HA | CARP address per zone and on the WAN
  vars:
    existing: "{{ opnsense_vips.json.rows | selectattr('descr', 'equalto', item.descr) | list }}"
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/interfaces/vip_settings/{{ 'set_item/' ~ existing[0].uuid if existing else 'add_item' }}"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    method: POST
    body_format: json
    body:
      vip:
        mode: carp
        interface: "{{ item.interface }}"
        network: "{{ item.network }}"
        vhid: "{{ item.vhid }}"
        advbase: "1"
        advskew: "{{ opnsense_node.advskew | string }}"
        password: "{{ opnsense_carp_password }}"
        descr: "{{ item.descr }}"
  delegate_to: localhost
  loop: "{{ opnsense_vips_wanted }}"
  loop_control:
    label: "{{ item.descr }} {{ item.network }} (VHID {{ item.vhid }})"
  when: >-
    not existing or existing[0].mode != 'carp' or existing[0].interface != item.interface or
    existing[0].subnet ~ '/' ~ existing[0].subnet_bits != item.network or
    existing[0].vhid != item.vhid or existing[0].advskew != opnsense_node.advskew | string
  register: opnsense_vip_set
  changed_when: opnsense_vip_set.json.result == "saved"
  failed_when: opnsense_vip_set.json.result is not defined or opnsense_vip_set.json.result == "failed"
  no_log: true   # body carries the CARP password

- name: HA | apply virtual IPs
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/interfaces/vip_settings/reconfigure"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    method: POST
  delegate_to: localhost
  when: opnsense_vip_set is changed
  changed_when: true

- name: HA | current sync settings
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/core/hasync/get"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
  delegate_to: localhost
  register: opnsense_hasync

# Option fields come back as {key: {value, selected}}.
- name: HA | pfsync to the peer over {{ opnsense_sync_if.descr }}, preemption on, no config sync
  vars:
    current: "{{ opnsense_hasync.json.hasync }}"
    selected_if: "{{ current.pfsyncinterface | dict2items | selectattr('value.selected', 'equalto', 1) | map(attribute='key') | first | default('') }}"
    selected_ver: "{{ current.pfsyncversion | dict2items | selectattr('value.selected', 'equalto', 1) | map(attribute='key') | first | default('') }}"
    wanted:
      pfsyncinterface: "{{ opnsense_sync_ifname }}"
      pfsyncpeerip: "{{ opnsense_peer_sync_ip }}"
      pfsyncversion: "1500"
      disablepreempt: "0"
      synchronizetoip: ""
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/core/hasync/set"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    method: POST
    body_format: json
    body:
      hasync: "{{ wanted }}"
  delegate_to: localhost
  when: >-
    selected_if != wanted.pfsyncinterface or current.pfsyncpeerip != wanted.pfsyncpeerip or
    selected_ver != wanted.pfsyncversion or current.disablepreempt != wanted.disablepreempt or
    current.synchronizetoip != wanted.synchronizetoip
  register: opnsense_hasync_set
  changed_when: opnsense_hasync_set.json.result == "saved"
  failed_when: opnsense_hasync_set.json.result is not defined or opnsense_hasync_set.json.result == "failed"

- name: HA | apply sync settings
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/core/hasync/reconfigure"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    method: POST
  delegate_to: localhost
  when: opnsense_hasync_set is changed
  changed_when: true

- name: HA | current outbound NAT mode
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/firewall/source_nat/get"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
  delegate_to: localhost
  register: opnsense_snat_general

- name: HA | outbound NAT hybrid (automatic rules plus the CARP ones below)
  vars:
    mode: "{{ opnsense_snat_general.json.filter.general.snat_mode | dict2items | selectattr('value.selected', 'equalto', 1) | map(attribute='key') | first | default('') }}"
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/firewall/source_nat/set"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    method: POST
    body_format: json
    body:
      filter:
        general:
          snat_mode: hybrid
  delegate_to: localhost
  when: mode != 'hybrid'
  register: opnsense_snat_mode_set
  changed_when: opnsense_snat_mode_set.json.result == "saved"
  failed_when: opnsense_snat_mode_set.json.result is not defined or opnsense_snat_mode_set.json.result == "failed"

- name: HA | outbound NAT rules
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/firewall/source_nat/search_rule"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
  delegate_to: localhost
  register: opnsense_snat_rules

- name: HA | each lab zone leaves through the WAN CARP address
  vars:
    descr: "CARP: {{ item.descr }} out via the WAN CARP address"
    existing: "{{ opnsense_snat_rules.json.rows | selectattr('description', 'defined') | selectattr('description', 'equalto', descr) | list }}"
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/firewall/source_nat/{{ 'set_rule/' ~ existing[0].uuid if existing else 'add_rule' }}"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    method: POST
    body_format: json
    body:
      rule:
        enabled: "1"
        interface: wan
        ipprotocol: inet
        protocol: any
        source_net: "{{ item.cidr }}"
        destination_net: any
        target: "{{ firewall_wan_vip }}"
        description: "{{ descr }}"
  delegate_to: localhost
  loop: "{{ opnsense_zones }}"
  loop_control:
    label: "{{ item.descr }} -> {{ firewall_wan_vip }}"
  when: not existing or existing[0].source_net != item.cidr or existing[0].target != firewall_wan_vip
  register: opnsense_snat_rule_set
  changed_when: opnsense_snat_rule_set.json.result == "saved"
  failed_when: opnsense_snat_rule_set.json.result is not defined or opnsense_snat_rule_set.json.result == "failed"

- name: HA | firewall rules
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/firewall/filter/search_rule/"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
  delegate_to: localhost
  register: opnsense_ha_rules

- name: HA | allow the peer on the pfsync interface
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/firewall/filter/add_rule/"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    method: POST
    body_format: json
    body:
      rule:
        enabled: "1"
        action: pass
        quick: "1"
        interface: "{{ opnsense_sync_ifname }}"
        direction: in
        ipprotocol: inet
        protocol: any
        source_net: "{{ opnsense_sync_if.cidr }}"
        destination_net: any
        description: "Allow pfsync from the CARP peer"
  delegate_to: localhost
  when: >-
    opnsense_ha_rules.json.rows | selectattr('description', 'equalto', 'Allow pfsync from the CARP peer')
    | list | length == 0
  register: opnsense_sync_rule_add
  changed_when: opnsense_sync_rule_add.json.result == "saved"
  failed_when: opnsense_sync_rule_add.json.result is not defined or opnsense_sync_rule_add.json.result == "failed"

- name: HA | apply firewall and NAT changes
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/firewall/filter/apply"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    method: POST
  delegate_to: localhost
  when: opnsense_snat_mode_set is changed or opnsense_snat_rule_set is changed or opnsense_sync_rule_add is changed
  changed_when: true
