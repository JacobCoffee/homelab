# Fire TV DNS-over-TLS (fire-tv/DECISIONS.md "DNS"): the stick's Android Private DNS hostname
# (firetv.dns.z7x.org) resolves publicly to the WAN CARP address, so these forwards let it reach
# AdGuard's DoT listener from the house LAN the same way lab_dns.yml does for plain DNS. 8443
# forwards to AdGuard's HTTPS API/UI (same cert, port 443 inside the CT) for house-LAN-only tools
# (Hearth on the stick, this Mac); never port-forwarded on 80/443 directly, so the plain HTTP API
# (used by external-dns-adguard, adguard-exporter, the Ansible role) stays lab-internal.
# 8920 (Jellyfin's usual HTTPS port; 443 here is the OPNsense GUI) forwards to the internal
# Envoy Gateway, so the Jellyfin app reaches https://media.z7x.org:8920 over the house LAN
# instead of hairpinning video through Cloudflare: AdGuard answers media.z7x.org with this WAN
# address for the firetv client only (adguard role, files/firetv-telemetry.txt). Every other app
# on that gateway keeps its own gate (Pocket ID via lab-sso, or its own login).
- name: Fire TV DoT | existing port forwards
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/firewall/d_nat/search_rule"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
  delegate_to: localhost
  register: opnsense_firetv_dnat_rules

- name: Fire TV DoT | forward WAN CARP address port {{ item.wan_port }} to {{ item.target }}:{{ item.target_port }}
  vars:
    existing: "{{ opnsense_firetv_dnat_rules.json.rows | selectattr('descr', 'equalto', item.descr) | list }}"
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/firewall/d_nat/{{ 'set_rule/' ~ existing[0].uuid if existing else 'add_rule' }}"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    method: POST
    body_format: json
    body:
      rule:
        interface: wan
        ipprotocol: inet
        protocol: TCP
        destination: {network: "{{ firewall_wan_vip }}", port: "{{ item.wan_port }}"}
        target: "{{ item.target }}"
        local-port: "{{ item.target_port }}"
        descr: "{{ item.descr }}"
        pass: pass
  delegate_to: localhost
  loop:
    - { wan_port: "853", target: "{{ lab_dns }}", target_port: "853", descr: "Fire TV DoT: WAN 853 to AdGuard" }
    - { wan_port: "8443", target: "{{ lab_dns }}", target_port: "443", descr: "Fire TV DoT: WAN 8443 to AdGuard HTTPS API" }
    - { wan_port: "8920", target: "{{ k8s_internal_gateway }}", target_port: "443", descr: "Fire TV: WAN 8920 to the internal gateway (Jellyfin)" }
  loop_control:
    label: "{{ item.descr }}"
  register: opnsense_firetv_dnat_add
  when: >-
    not existing or existing[0]['destination.network'] != firewall_wan_vip or
    existing[0].target != item.target or existing[0]['local-port'] != item.target_port
  changed_when: opnsense_firetv_dnat_add.json.result == "saved"
  failed_when: opnsense_firetv_dnat_add.json.result is not defined or opnsense_firetv_dnat_add.json.result == "failed"

- name: Fire TV DoT | apply firewall/NAT changes
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/firewall/filter/apply"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    method: POST
  delegate_to: localhost
  when: opnsense_firetv_dnat_add is changed
  changed_when: true

# dns.z7x.org is the first z7x.org name with a private (house-LAN) address. Unbound's DNS-rebind
# protection strips private answers for public names, so lab clients (and AdGuard, which asks
# Unbound) got nothing for it. Allow just this domain; keep whatever else is already listed.
# Empty entries are dropped: an empty selected entry (what setting the field to "" leaves behind)
# joined into ",dns.z7x.org", rendered an invalid advanced.conf, and Unbound refused to start on
# reconfigure, which took lab DNS down. The status check below fails the run if that recurs.
- name: Fire TV DoT | Unbound advanced settings
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/unbound/settings/get"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
  delegate_to: localhost
  register: opnsense_unbound_adv

- name: Fire TV DoT | allow dns.z7x.org's private answer past rebind protection
  vars:
    current: >-
      {{ opnsense_unbound_adv.json.unbound.advanced.privatedomain | dict2items
         | selectattr('value.selected', 'equalto', 1) | map(attribute='key')
         | map('trim') | reject('equalto', '') | list }}
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/unbound/settings/set"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    method: POST
    body_format: json
    body:
      unbound:
        advanced:
          privatedomain: "{{ (current + ['dns.' ~ domain]) | unique | join(',') }}"
  delegate_to: localhost
  register: opnsense_unbound_privdomain
  when: ('dns.' ~ domain) not in current
  changed_when: opnsense_unbound_privdomain.json.result == "saved"
  failed_when: opnsense_unbound_privdomain.json.result is not defined or opnsense_unbound_privdomain.json.result == "failed"

- name: Fire TV DoT | reload Unbound
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/unbound/service/reconfigure"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    method: POST
  delegate_to: localhost
  when: opnsense_unbound_privdomain is changed
  changed_when: true

- name: Fire TV DoT | Unbound is running again
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/unbound/service/status"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
  delegate_to: localhost
  register: opnsense_unbound_status
  until: opnsense_unbound_status.json.status | default('') == 'running'
  retries: 10
  delay: 3
  when: opnsense_unbound_privdomain is changed
