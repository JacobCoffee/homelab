# Fire TV DNS-over-TLS (fire-tv/DECISIONS.md "DNS"): the stick's Android Private DNS hostname
# (firetv.dns.z7x.org) resolves publicly to the WAN CARP address, so these forwards let it reach
# AdGuard's DoT listener from the house LAN the same way lab_dns.yml does for plain DNS. 8443
# forwards to AdGuard's HTTPS API/UI (same cert, port 443 inside the CT) for house-LAN-only tools
# (Hearth on the stick, this Mac); never port-forwarded on 80/443 directly, so the plain HTTP API
# (used by external-dns-adguard, adguard-exporter, the Ansible role) stays lab-internal.
- name: Fire TV DoT | existing port forwards
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/firewall/d_nat/search_rule"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
  delegate_to: localhost
  register: opnsense_firetv_dnat_rules

- name: Fire TV DoT | forward WAN CARP address port {{ item.wan_port }} to AdGuard {{ item.target_port }}
  vars:
    existing: "{{ opnsense_firetv_dnat_rules.json.rows | selectattr('descr', 'equalto', item.descr) | list }}"
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/firewall/d_nat/{{ 'set_rule/' ~ existing[0].uuid if existing else 'add_rule' }}"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    method: POST
    body_format: json
    body:
      rule:
        interface: wan
        ipprotocol: inet
        protocol: TCP
        destination: {network: "{{ firewall_wan_vip }}", port: "{{ item.wan_port }}"}
        target: "{{ lab_dns }}"
        local-port: "{{ item.target_port }}"
        descr: "{{ item.descr }}"
        pass: pass
  delegate_to: localhost
  loop:
    - { wan_port: "853", target_port: "853", descr: "Fire TV DoT: WAN 853 to AdGuard" }
    - { wan_port: "8443", target_port: "443", descr: "Fire TV DoT: WAN 8443 to AdGuard HTTPS API" }
  loop_control:
    label: "{{ item.descr }}"
  register: opnsense_firetv_dnat_add
  when: >-
    not existing or existing[0]['destination.network'] != firewall_wan_vip or
    existing[0].target != lab_dns or existing[0]['local-port'] != item.target_port
  changed_when: opnsense_firetv_dnat_add.json.result == "saved"
  failed_when: opnsense_firetv_dnat_add.json.result is not defined or opnsense_firetv_dnat_add.json.result == "failed"

- name: Fire TV DoT | apply firewall/NAT changes
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/firewall/filter/apply"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    method: POST
  delegate_to: localhost
  when: opnsense_firetv_dnat_add is changed
  changed_when: true
