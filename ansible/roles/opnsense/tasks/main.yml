- name: Does the OPNsense VM exist?
  ansible.builtin.command: qm status {{ opnsense_vmid }}
  register: opnsense_vm_status
  changed_when: false
  failed_when: false

- name: Create and bootstrap the OPNsense VM
  ansible.builtin.include_tasks: create.yml
  when: opnsense_vm_status.rc != 0

- name: VM NICs
  ansible.builtin.command: qm config {{ opnsense_vmid }}
  register: opnsense_qm_config
  changed_when: false

# Same MAC, new bridge: the guest keeps vtnetN = zone N. mtu=1 hands the vnet's MTU to virtio.
- name: Lab NICs on their zone's vnet
  vars:
    nic: "{{ opnsense_qm_config.stdout | regex_search('(?m)^net' ~ (idx + 1) ~ ': (.*)$', '\\1') | first }}"
    mac: "{{ nic | regex_search('virtio=([0-9A-Fa-f:]{17})', '\\1') | first }}"
    wanted: "virtio={{ mac }},bridge={{ item.bridge }},mtu=1"
  ansible.builtin.command: qm set {{ opnsense_vmid }} --net{{ idx + 1 }} {{ wanted }}
  loop: "{{ opnsense_zones }}"
  loop_control:
    index_var: idx
    label: "net{{ idx + 1 }} -> {{ item.bridge }}"
  when: nic != wanted
  changed_when: true
  register: opnsense_nic_moved

# Hot-replugged virtio NICs come back down inside FreeBSD; a clean reboot brings them up.
- name: Reboot after moving NICs
  ansible.builtin.command: qm reboot {{ opnsense_vmid }} --timeout 120
  when: opnsense_nic_moved is changed
  changed_when: true

# Tagged like the tagged includes below, so `--tags monitoring` / `--tags syslog` still learn the
# WAN address and wait for the API they need (the core play's own tag doesn't match those runs).
- name: Locate the WAN address
  ansible.builtin.include_tasks:
    file: wan_ip.yml
    apply:
      tags: [monitoring, syslog]
  tags: [monitoring, syslog]

- name: Wait for the OPNsense API
  ansible.builtin.uri:
    url: "https://{{ opnsense_wan_ip }}/api/core/firmware/status"
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    timeout: 5  # per try; the default 30 s made an unreachable WAN take ~30 min to fail
  delegate_to: localhost
  register: opnsense_api
  until: opnsense_api.status == 200
  retries: 36
  delay: 5
  no_log: true
  tags: [monitoring, syslog]

- name: Patch OPNsense (reboots if the update needs it)
  ansible.builtin.include_tasks: firmware.yml
  when: opnsense_update | bool

- name: Lab interface MTU
  ansible.builtin.include_tasks: interfaces.yml

- name: Configure OPNsense via the REST API
  ansible.builtin.include_tasks: api.yml

- name: Tailscale subnet router for the lab zones
  ansible.builtin.include_tasks: tailscale.yml

- name: Prometheus node_exporter plugin + firewall rule for the K8S zone
  ansible.builtin.include_tasks:
    file: node_exporter.yml
    apply:
      tags: [monitoring]
  tags: [monitoring]

# apply.tags (not just the outer tags:) is required for a dynamic include_tasks' inner tasks to
# actually run under `--tags syslog` -- the outer tags: only gates the include step itself.
- name: Remote syslog to Alloy
  ansible.builtin.include_tasks:
    file: syslog.yml
    apply:
      tags: [syslog]
  tags: [syslog]

- name: DHCP options (MTU, AdGuard) and the WAN DNS port-forward
  ansible.builtin.include_tasks: lab_dns.yml

- name: Report
  ansible.builtin.debug:
    msg: >-
      {{ opnsense_hostname }} is up: https://{{ opnsense_wan_ip }}/ (OPNsense
      {{ opnsense_api.json.product.CORE_VERSION | default('?') }}).
      Reserve {{ opnsense_wan_ip }} for MAC {{ opnsense_wan_mac }} in the My Spectrum app.
