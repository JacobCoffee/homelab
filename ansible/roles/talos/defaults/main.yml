# Talos release and Image Factory schematic (kubernetes/talos/schematic.yaml: adds
# qemu-guest-agent, plus i915/intel-ucode for hnk8s05's passed-through Intel UHD 630).
# Re-post the schematic to factory.talos.dev after editing it.
# Renovate bumps the annotated pins; changing them here doesn't upgrade running nodes
# (talosctl upgrade / upgrade-k8s does, see kubernetes/README.md). New hnk8s05 schematic
# (adds GPU extensions) was applied to the running node directly with `talosctl upgrade
# --image factory.talos.dev/installer/<id>:v1.14.5 -n 10.10.30.15 --preserve`; the other
# nodes stay on the prior installer image until their next talosctl upgrade picks this up.
# renovate: datasource=github-releases depName=siderolabs/talos
talos_version: v1.14.5
talos_schematic_id: d32a2cb3cd2dd937e38505169bc1e0401d08ec95b6cb599156a7184010665b4e
# renovate: datasource=github-releases depName=kubernetes/kubernetes extractVersion=^v(?<version>.+)$
k8s_version: 1.37.2

talos_iso: talos-{{ talos_version }}-{{ talos_schematic_id[:8] }}-metal-amd64.iso
talos_iso_url: https://factory.talos.dev/image/{{ talos_schematic_id }}/{{ talos_version }}/metal-amd64.iso
# Control-plane disks (etcd) sit alone on each host's NVMe pool; workers' disks (image pulls,
# emptyDirs, logs) go on the SATA mirror so their write bursts can't stall etcd's fsyncs.
talos_storage: fast
talos_worker_storage: vmdata
talos_zone: "{{ lab_zones | selectattr('name', 'equalto', 'k8s') | first }}"
# Nodes with role controlplane (the default): etcd members, VIP holders, talosctl endpoints.
talos_controlplanes: "{{ k8s_nodes | rejectattr('role', 'defined') | list + k8s_nodes | selectattr('role', 'defined') | selectattr('role', 'equalto', 'controlplane') | list }}"

# Repo paths (controller side).
talos_dir: "{{ playbook_dir }}/../../kubernetes/talos"
talos_config: "{{ talos_dir }}/talosconfig"
talos_kubeconfig: "{{ playbook_dir }}/../../kubernetes/kubeconfig"
talos_repo: "{{ playbook_dir }}/../.."
talos_mise: "mise -C {{ talos_repo }} exec --"   # tool versions pinned in the repo's mise.toml

# Bootstrap only; afterwards Flux owns Cilium (kubernetes/apps/kube-system/cilium).
# renovate: datasource=helm depName=cilium registryUrl=https://helm.cilium.io
cilium_version: 1.20.4
flux_github_owner: JacobCoffee
flux_github_repo: homelab
