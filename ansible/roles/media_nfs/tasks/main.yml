# hnnfs01 (VM {{ media_nfs.vmid }} on this Proxmox node): temporary media NFS server
# (kubernetes/apps/media NFS PVs mount it at /media until a NAS takes over).
- name: Does the VM exist?
  ansible.builtin.command: qm status {{ media_nfs.vmid }}
  register: media_nfs_vm_status
  changed_when: false
  failed_when: false

- name: Create the VM
  ansible.builtin.include_tasks: vm.yml
  when: media_nfs_vm_status.rc != 0

- name: Start it if stopped
  ansible.builtin.command: qm start {{ media_nfs.vmid }}
  when: media_nfs_vm_status.rc == 0 and 'running' not in media_nfs_vm_status.stdout
  changed_when: true

- name: Configure NFS
  ansible.builtin.include_tasks: configure.yml
