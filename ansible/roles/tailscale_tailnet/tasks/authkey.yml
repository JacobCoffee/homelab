# Mint a single-use, pre-approved auth key for one join and set tailscale_join_key.
# Use from another role:
#   - ansible.builtin.include_role:
#       name: tailscale_tailnet
#       tasks_from: authkey
#     vars:
#       tailscale_key_tags: [tag:pve]
#       tailscale_key_name: hnfw01   # optional, defaults to the inventory host
- name: Mint a Tailscale auth key for {{ tailscale_key_name | default(inventory_hostname) }}
  ansible.builtin.uri:
    url: "{{ tailscale_api }}/tailnet/{{ tailscale_tailnet }}/keys"
    method: POST
    headers:
      Authorization: "Bearer {{ tailscale_api_key }}"
    body_format: json
    body:
      description: "ansible {{ tailscale_key_name | default(inventory_hostname) }}"
      expirySeconds: "{{ tailscale_authkey_ttl | int }}"
      capabilities:
        devices:
          create:
            reusable: false
            ephemeral: false
            preauthorized: true
            tags: "{{ tailscale_key_tags }}"
    status_code: 200
  register: tailscale_minted
  delegate_to: localhost
  no_log: true

- name: Keep the key for the join
  ansible.builtin.set_fact:
    tailscale_join_key: "{{ tailscale_minted.json.key }}"
  no_log: true
