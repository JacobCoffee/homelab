---
pve_oidc_realm: pocket-id
pve_oidc_issuer_url: https://id.z7x.org
pve_oidc_client_id: proxmox
# Pocket ID's discovery doc (claims_supported) has no plain "username" claim, only
# preferred_username, so logins become <preferred_username>@pocket-id.
pve_oidc_username_claim: preferred_username
pve_oidc_scopes: openid email profile groups
pve_oidc_groups_claim: groups
# PVE suffixes OpenID groups-claim groups with -<realm> to avoid collisions (pveum(1), "Groups
# mapping"): the lab-admins claim value becomes this group once groups-autocreate creates it.
pve_oidc_admin_group: "lab-admins-{{ pve_oidc_realm }}"
pve_oidc_admin_role: Administrator
