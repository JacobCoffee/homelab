# Pinned release tarball, checksum-verified, installed as a systemd service from /opt/AdGuardHome.
- name: Installed version
  ansible.builtin.command: pct exec {{ adguard_ctid }} -- /opt/AdGuardHome/AdGuardHome --version
  register: adguard_installed
  changed_when: false
  failed_when: false

- name: Install {{ adguard_version }}
  when: adguard_version not in adguard_installed.stdout | default('')
  block:
    - name: curl in the container
      ansible.builtin.command: pct exec {{ adguard_ctid }} -- sh -c 'command -v curl || (apt-get update -q && apt-get install -yq curl ca-certificates)'
      changed_when: "'Setting up curl' in adguard_curl.stdout"
      register: adguard_curl

    - name: Download, verify and unpack
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ adguard_ctid }}"
          - --
          - sh
          - -ec
          - |
            cd /tmp
            curl -fsSL -o agh.tar.gz '{{ adguard_url }}'
            echo '{{ adguard_sha256 }}  agh.tar.gz' | sha256sum -c -
            systemctl stop AdGuardHome 2>/dev/null || true
            tar -xzf agh.tar.gz -C /opt
            rm agh.tar.gz
      changed_when: true

    - name: Register the systemd service (first install only)
      ansible.builtin.command: pct exec {{ adguard_ctid }} -- sh -c 'systemctl cat AdGuardHome >/dev/null 2>&1 || /opt/AdGuardHome/AdGuardHome -s install'
      changed_when: true

    - name: Start it
      ansible.builtin.command: pct exec {{ adguard_ctid }} -- systemctl restart AdGuardHome
      changed_when: true
