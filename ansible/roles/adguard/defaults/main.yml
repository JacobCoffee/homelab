# AdGuard Home pair, each in an unprivileged Debian LXC on the INT zone (dns_servers in
# group_vars). Lab DHCP hands out lab_dns, which keepalived keeps on a healthy instance; each
# asks OPNsense's Unbound (DNSSEC, lab names) for everything it doesn't block.
adguard_node: "{{ dns_servers | selectattr('host', 'equalto', inventory_hostname) | first }}"
adguard_ctid: "{{ adguard_node.ctid }}"
adguard_hostname: "{{ adguard_node.name }}"
adguard_zone: int
adguard_ip: "{{ adguard_node.ip }}"

# keepalived: unicast VRRP between the instances (no multicast next to the firewalls' CARP).
adguard_vip: "{{ lab_dns }}"
adguard_vrrp_id: 53
adguard_vrrp_priority: "{{ adguard_node.priority }}"
adguard_vrrp_peers: "{{ dns_servers | rejectattr('host', 'equalto', inventory_hostname) | map(attribute='ip') | list }}"

adguard_template: debian-13-standard_13.6-1_amd64.tar.zst
adguard_storage: vmdata
adguard_cores: 1
adguard_memory: 512
adguard_disk_gb: 4

# Not tracked by Renovate: the checksum below has to change with it (release checksums.txt).
adguard_version: v0.107.79
adguard_sha256: c48f4a43000665484c5ec28177de11a004759b620dae8f77b2aabefc9ef3687f  # AdGuardHome_linux_amd64.tar.gz
adguard_url: "https://github.com/AdguardTeam/AdGuardHome/releases/download/{{ adguard_version }}/AdGuardHome_linux_amd64.tar.gz"

# Short and low-false-positive; AdGuard DNS filter is on by default.
adguard_filters:
  - { name: AdAway Default Blocklist, url: "https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt" }

adguard_user: admin
adguard_password: "{{ vault_adguard_password }}"

# <host>.<domain_tailnet> names for tailnet devices with these tags (tasks/internal_names.yml).
adguard_tailnet_tags: ["tag:pve", "tag:router"]
adguard_tailscale_api: https://api.tailscale.com/api/v2

# Static hostname rewrites independent of Tailscale (tasks/apps_rewrite.yml). Wildcards point
# tenant/app domains at an in-cluster LoadBalancer IP instead of a per-host Tailscale address.
adguard_static_rewrites:
  - domain: "*.apps.z7x.org"
    answer: "10.10.30.202"

# Fire TV DNS-over-TLS client + telemetry blocklist (fire-tv/DECISIONS.md "DNS" /
# "Telemetry blocklist", tasks/firetv_dot.yml). ClientID matches the Android Private DNS
# hostname's leftmost label (firetv.dns.z7x.org), read from the DoT SNI.
adguard_firetv_client_name: firetv
adguard_firetv_client_id: firetv
adguard_firetv_blocklist_path: /opt/AdGuardHome/userfilters/firetv-telemetry.txt

# Derived from the zone; no need to change.
adguard_zone_cfg: "{{ lab_zones | selectattr('name', 'equalto', adguard_zone) | first }}"
adguard_upstream: "{{ adguard_zone_cfg.gateway }}"
adguard_net0: >-
  name=eth0,bridge={{ adguard_zone_cfg.vnet }},gw={{ adguard_zone_cfg.gateway }},ip={{ adguard_ip }}/{{ adguard_zone_cfg.cidr.split('/')[1] }},mtu={{ lab_mtu }}
