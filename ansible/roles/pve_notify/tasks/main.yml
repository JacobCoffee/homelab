# Proxmox's own notification system (host/guest/backup/replication/package events) mirrored to
# Discord, alongside the builtin default-matcher (still mails root). Skipped entirely until
# vault_discord_webhook_url exists -- see kubernetes/README.md "Monitoring & alerting".
#
# Proxmox validates the `url` parameter against a URL-shaped regex before substituting
# Handlebars, so only the literal "https://discord.com/api/webhooks/" prefix can live there;
# the id/token suffix (opaque, sensitive) is the secret `webhook_path`, referenced as
# `{{ secrets.webhook_path }}` (wrapped in {% raw %} so Ansible passes it through un-rendered).
# Body uses the same Handlebars templating -- see Discord example in
# docs.proxmox.com (notifications.adoc) and pve-devel patch 20241108144124.273550-11.
# --header/--secret/--body are property strings / base64 per `pvesh usage
# /cluster/notifications/endpoints/webhook --verbose`.
- name: "Notify | existing webhook endpoints (no_log: contains the rendered secret handlebars)"
  ansible.builtin.command: pvesh get /cluster/notifications/endpoints/webhook --output-format json
  register: pve_notify_webhooks
  changed_when: false
  run_once: true
  no_log: true
  when: vault_discord_webhook_url is defined

- name: Notify | create the discord webhook endpoint
  ansible.builtin.command:
    argv:
      - pvesh
      - create
      - /cluster/notifications/endpoints/webhook
      - --name
      - discord
      - --method
      - post
      - --url
      - "{{ pve_notify_discord_url }}"
      - --header
      - "name=Content-Type,value={{ 'application/json' | b64encode }}"
      - --secret
      - "name=webhook_path,value={{ (vault_discord_webhook_url | regex_replace('^https://discord.com/api/webhooks/', '')) | b64encode }}"
      - --body
      - "{{ pve_notify_discord_body | b64encode }}"
      - --comment
      - "Mirrors Proxmox notifications to Discord"
  vars:
    pve_notify_discord_url: "https://discord.com/api/webhooks/{% raw %}{{ secrets.webhook_path }}{% endraw %}"
    pve_notify_discord_body: |-
      {% raw %}{
        "username": "Proxmox",
        "embeds": [
          {
            "color": 14839040,
            "title": "{{ escape title }}",
            "description": "{{ escape message }}",
            "fields": [
              { "name": "Severity", "value": "{{ escape severity }}", "inline": true },
              { "name": "Timestamp", "value": "<t:{{ timestamp }}>" }
            ]
          }
        ]
      }{% endraw %}
  when: >-
    vault_discord_webhook_url is defined and
    'discord' not in (pve_notify_webhooks.stdout | from_json | map(attribute='name') | list)
  changed_when: true
  no_log: true
  run_once: true

- name: Notify | existing matchers
  ansible.builtin.command: pvesh get /cluster/notifications/matchers --output-format json
  register: pve_notify_matchers
  changed_when: false
  run_once: true
  when: vault_discord_webhook_url is defined

# Matchers and endpoints share one name namespace in Proxmox's notification system, so this
# can't also be called "discord" (that's the endpoint created above). Warnings and errors only:
# successful backups and other info-level events are noise in Discord (the builtin
# default-matcher still mails root everything).
- name: Notify | route warnings and errors to Discord
  vars:
    current: "{{ pve_notify_matchers.stdout | from_json | selectattr('name', 'equalto', 'discord-all') | first | default({}) }}"
    wanted_severity: warning,error
    comment: "Warnings and errors to Discord (failed backups, fencing, replication, updates)"
  ansible.builtin.command:
    argv: >-
      {{ ['pvesh', 'set' if current else 'create',
          '/cluster/notifications/matchers' ~ ('/discord-all' if current else '')]
         + ([] if current else ['--name', 'discord-all', '--target', 'discord'])
         + ['--mode', 'all', '--match-severity', wanted_severity, '--comment', comment] }}
  when: >-
    vault_discord_webhook_url is defined and
    (not current or (current['match-severity'] | default([]) | join(',')) != wanted_severity
     or current.comment | default('') != comment)
  changed_when: true
  run_once: true

- name: Notify | blocked on vault_discord_webhook_url
  ansible.builtin.debug:
    msg: >-
      vault_discord_webhook_url is not in the vault yet; skipping the Discord webhook target and
      matcher. Add it and re-run with --tags notify.
  run_once: true
  when: vault_discord_webhook_url is not defined
