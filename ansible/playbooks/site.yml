# Everything, in order:  ansible-playbook playbooks/site.yml
# Skip a part with --skip-tags, e.g. before tailscale_authkey is in the vault:
#   ansible-playbook playbooks/site.yml --skip-tags tailscale
- name: Proxmox cluster (create, then join every node)
  hosts: pve
  tags: [cluster]
  roles:
    - pve_cluster

- name: All Proxmox nodes
  hosts: pve
  tags: [tailscale]
  roles:
    - tailscale

- name: Core node (extra NICs, OPNsense)
  hosts: core
  tags: [core]
  roles:
    - pve_network
    - opnsense
