# Everything, in order:  ansible-playbook playbooks/site.yml
# Skip a part with --skip-tags, e.g. before tailscale_api_key is in the vault:
#   ansible-playbook playbooks/site.yml --skip-tags tailscale
- name: Proxmox cluster (create, then join every node)
  hosts: pve
  tags: [cluster]
  roles:
    - pve_cluster

- name: Lab networks (SDN VXLAN zone across every node)
  hosts: pve
  tags: [sdn]
  roles:
    - pve_sdn

- name: Tailnet policy (tags, route approval, access) from the repo
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [tailscale]
  roles:
    - tailscale_tailnet

- name: All Proxmox nodes
  hosts: pve
  tags: [tailscale]
  roles:
    - tailscale

- name: Core node (OPNsense, lab DNS)
  hosts: core
  tags: [core]
  roles:
    - opnsense
    - adguard
