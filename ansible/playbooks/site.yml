# Everything, in order:  ansible-playbook playbooks/site.yml
# Skip a part with --skip-tags, e.g. before tailscale_api_key is in the vault:
#   ansible-playbook playbooks/site.yml --skip-tags tailscale
- name: Proxmox cluster (create, then join every node)
  hosts: pve
  tags: [cluster]
  roles:
    - pve_cluster

- name: Lab networks (SDN VXLAN zone across every node)
  hosts: pve
  tags: [sdn]
  roles:
    - pve_sdn

- name: Proxmox certificates (trusted pveproxy cert per node via Let's Encrypt DNS-01)
  hosts: pve
  tags: [acme]
  roles:
    - pve_acme

- name: Tailnet policy (tags, route approval, access) from the repo
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [tailscale]
  roles:
    - tailscale_tailnet

- name: All Proxmox nodes
  hosts: pve
  tags: [tailscale]
  roles:
    - tailscale

- name: Core node (OPNsense, lab DNS)
  hosts: core
  tags: [core]
  roles:
    - opnsense
    - adguard

- name: "Proxmox backups (local vzdump: ZFS dataset + nightly cluster job)"
  hosts: pve
  tags: [backup]
  roles:
    - pve_backup

- name: "Proxmox CSI plugin (user, role, token -> SOPS secret in kubernetes/apps/storage)"
  hosts: pve
  tags: [csi]
  roles:
    - pve_csi

- name: "Prometheus PVE exporter token (user, role, token -> SOPS secrets in kubernetes/apps/observability)"
  hosts: pve
  tags: [monitoring]
  roles:
    - monitoring_pve

- name: "Proxmox host syslog -> Alloy (kubernetes/apps/observability/alloy)"
  hosts: pve
  tags: [syslog]
  roles:
    - pve_syslog

- name: "Proxmox notifications (Discord webhook target + matcher)"
  hosts: pve
  tags: [notify]
  roles:
    - pve_notify

- name: "Cloudflare cache rules (z7x.org): bypass cache for media.z7x.org video streaming"
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [cloudflare]
  roles:
    - cloudflare_cache_rules

- name: "Media NFS VM (temporary, on the K8S zone; see kubernetes README)"
  hosts: pve
  tags: [media-nfs]
  tasks:
    - name: Media NFS VM
      ansible.builtin.include_role:
        name: media_nfs
      when: inventory_hostname == media_nfs.host

- name: Home Assistant OS (on the node with the radio stick)
  hosts: pve
  tags: [homeassistant]
  tasks:
    - name: Home Assistant VM
      ansible.builtin.include_role:
        name: homeassistant
      when: inventory_hostname == home_assistant.host

- name: Talos VMs (on the node each one is assigned to)
  hosts: pve
  tags: [k8s]
  tasks:
    - name: Talos VMs
      ansible.builtin.include_role:
        name: talos
        tasks_from: vms

- name: Talos Kubernetes cluster (install, bootstrap, kubeconfig, Cilium, Flux)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [k8s]
  tasks:
    - name: Talos cluster
      ansible.builtin.include_role:
        name: talos
        tasks_from: cluster

    - name: Cilium, SOPS key, Flux
      ansible.builtin.include_role:
        name: talos
        tasks_from: bootstrap

# hnpxe01 netboot CT (also runnable alone: playbooks/netboot.yml, tag netboot)
- import_playbook: netboot.yml
