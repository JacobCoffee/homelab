[tools]
gitleaks = "8.30.1"
# Kubernetes (kubernetes/): Talos 1.14 ships Kubernetes 1.37.
talosctl = "1.14.5"
kubectl = "1.37.2"
helm = "4.3.1"
flux2 = "2.10.0"
sops = "3.13.3"
age = "1.3.2"
# Restores / snapshot inspection for the R2 backup repos (kubernetes/apps/backup, VolSync, pve_backup).
restic = "0.19.1"
# Cabotage PaaS infra (terraform/cabotage/): OpenTofu, not Terraform, to keep a public repo
# clear of the BSL.
opentofu = "1.13.2"

[env]
# Written by the talos role (git-ignored); reachable over Tailscale via OPNsense's lab routes.
TALOSCONFIG = "{{ config_root }}/kubernetes/talos/talosconfig"
KUBECONFIG = "{{ config_root }}/kubernetes/kubeconfig"
SOPS_AGE_KEY_FILE = "{{ env.HOME }}/.config/sops/age/keys.txt"
