services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: hearth-teststack-adguard
    restart: unless-stopped
    ports:
      - "${TESTSTACK_HOST:?set TESTSTACK_HOST in config/site.env}:3000:3000/tcp"
      - "${TESTSTACK_HOST}:5353:53/tcp"
      - "${TESTSTACK_HOST}:5353:53/udp"
    volumes:
      - adguard-work:/opt/adguardhome/work
      - adguard-conf:/opt/adguardhome/conf

  uptime-kuma:
    # Same major as the cluster's Kuma (apps/status/uptime-kuma), which Hearth reads in production.
    image: louislam/uptime-kuma:2
    container_name: hearth-teststack-kuma
    restart: unless-stopped
    environment:
      # Kuma 2 holds a fresh install at its database-choice page (no API until it's answered).
      UPTIME_KUMA_DB_TYPE: sqlite
    ports:
      - "${TESTSTACK_HOST}:3001:3001/tcp"
    volumes:
      - kuma-data:/app/data

  catalog:
    image: caddy:2-alpine
    container_name: hearth-teststack-catalog
    restart: unless-stopped
    ports:
      - "${TESTSTACK_HOST}:8088:8088/tcp"
    volumes:
      - ../dist/catalog:/srv/catalog:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  adguard-work:
  adguard-conf:
  kuma-data:
