org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 9 defaults to creating unit test tasks only for the tested build type
# (testDebugUnitTest). The Makefile's `make test` target runs
# testReleaseUnitTest, so keep release unit tests enabled too.
android.onlyEnableUnitTestForTheTestedBuildType=false
