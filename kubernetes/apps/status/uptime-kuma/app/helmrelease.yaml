# louislam/uptime-kuma:2.5.9-slim, latest 2.x (v2) release as of 2026-11-02. Upgraded from v1
# (1.23.17-alpine) after verifying the v1->v2 SQLite migration and the uptime-kuma-api2 PyPI
# client (the seed CronJob's dependency, replacing the abandoned uptime-kuma-api) against a
# throwaway copy of the live database. No alpine variant exists for v2; -slim is upstream's
# closest equivalent (plain Debian base, same root-entrypoint behaviour as v1's alpine image).
# Admin setup is driven by the seed CronJob (seed-cronjob.yaml), not this HelmRelease -- Kuma
# has no "set admin via env" first-run option.
#
# No runAsNonRoot/fsGroup here: the upstream image's entrypoint runs as root to chown/prepare
# /app/data (PUID/PGID env vars are the opt-in way to drop privileges, and even then upstream
# warns the rootless variant can have issues) -- forcing a non-root securityContext breaks its
# startup, so we run it as shipped rather than fight the image.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uptime-kuma
  namespace: status
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      uptime-kuma:
        strategy: Recreate
        containers:
          app:
            image:
              repository: louislam/uptime-kuma
              tag: "2.5.9-slim"
            env:
              TZ: America/Chicago
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 3001
                  initialDelaySeconds: 15
                  periodSeconds: 15
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 15
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
    service:
      app:
        controller: uptime-kuma
        ports:
          http:
            port: *port
    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: proxmox-vmdata
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /app/data
