# ghcr.io/gethomepage/homepage v2.7.0, latest release as of 2026-11-02. The image ships prebuilt;
# the community-scripts LXC's 4 GB is for compiling it from source, which doesn't happen here.
#
# /app/config is the read-only homepage-config ConfigMap. Homepage copies a skeleton for any
# config file that's missing (and exits if it can't), so every file it looks for is in config/,
# even the empty ones. LOG_TARGETS=stdout keeps it from writing config/logs/.
#
# Credentials: homepage-secrets (secret.sops.yaml, written by ansible/roles/homepage) as
# HOMEPAGE_VAR_* env vars, which Homepage substitutes into {{HOMEPAGE_VAR_...}} in the config.
# Env is read at start: after the Secret changes, kubectl -n status rollout restart deploy/homepage.
# A variable that doesn't exist yet only breaks the widget using it. The service account's
# read-only ClusterRole (rbac.yaml) feeds the Kubernetes widget and per-app pod stats.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: status
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      homepage:
        serviceAccount:
          identifier: homepage
        containers:
          app:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f
            env:
              TZ: America/Chicago
              HOMEPAGE_ALLOWED_HOSTS: start.z7x.org
              LOG_TARGETS: stdout
            envFrom:
              - secretRef:
                  name: homepage-secrets
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthcheck
                    port: &port 3000
                    # Homepage rejects requests whose Host isn't in HOMEPAGE_ALLOWED_HOSTS.
                    httpHeaders:
                      - name: Host
                        value: start.z7x.org
                  periodSeconds: 15
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 384Mi
        pod:
          automountServiceAccountToken: true
          # Every URL in the config is fully qualified. With the default ndots:5, each of the ~30
          # concurrent checks first walks the search list (one entry goes out to AdGuard), and
          # bursts of those time out as EAI_AGAIN; ndots:1 looks the name up as written first.
          dnsConfig:
            options:
              - name: ndots
                value: "1"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
    serviceAccount:
      homepage: {}
    service:
      app:
        controller: homepage
        ports:
          http:
            port: *port
    persistence:
      config:
        type: configMap
        name: homepage-config
        globalMounts:
          - path: /app/config
            readOnly: true
