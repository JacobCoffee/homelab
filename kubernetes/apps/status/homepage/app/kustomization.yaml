apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./httproute.yaml
# Mounted as a directory (not subPath), so edits reach the pod on kubelet's next sync with no
# restart; a fixed name because the HelmRelease refers to it.
configMapGenerator:
  - name: homepage-config
    files:
      - ./config/bookmarks.yaml
      - ./config/custom.css
      - ./config/custom.js
      - ./config/docker.yaml
      - ./config/kubernetes.yaml
      - ./config/proxmox.yaml
      - ./config/services.yaml
      - ./config/settings.yaml
      - ./config/widgets.yaml
generatorOptions:
  disableNameSuffixHash: true
