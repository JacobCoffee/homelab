# href is what your browser opens; siteMonitor is checked from the pod (dot next to each link).
# *.z7x.org app names resolve in-cluster to the internal gateway. Proxmox and OPNsense are
# checked by IP: their *.internal.z7x.org names are tailnet addresses pods can't reach.
# Icons: https://dashboardicons.com (name.svg) or mdi-<name>.
- Media:
    - Jellyfin:
        href: https://media.z7x.org
        siteMonitor: https://media.z7x.org
        icon: jellyfin.svg
        description: Movies, TV, music
    - Seerr:
        href: https://requests.z7x.org
        siteMonitor: https://requests.z7x.org
        icon: jellyseerr.svg
        description: Requests
    - Sonarr:
        href: https://sonarr.z7x.org
        siteMonitor: https://sonarr.z7x.org
        icon: sonarr.svg
        description: TV
    - Radarr:
