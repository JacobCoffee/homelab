          type: adguard
          url: http://10.10.10.53
          username: "{{HOMEPAGE_VAR_ADGUARD_USER}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"

# Each firewall has its own API key (no config sync), so each widget talks to that firewall's
# own K8S-zone address. The links go to the shared CARP address, i.e. whichever is master.
- Infrastructure:
    - Proxmox hnhv01:
        href: https://hnhv01.internal.z7x.org:8006
        siteMonitor: https://192.168.1.220:8006
        icon: proxmox.svg
        widget:
          type: proxmox
          url: https://192.168.1.220:8006
          username: "{{HOMEPAGE_VAR_PVE_TOKEN_ID}}"
          password: "{{HOMEPAGE_VAR_PVE_TOKEN_SECRET}}"
          node: hnhv01
    - Proxmox hnhv02:
        href: https://hnhv02.internal.z7x.org:8006
        siteMonitor: https://192.168.1.192:8006
        icon: proxmox.svg
        widget:
          type: proxmox
          url: https://192.168.1.192:8006
          username: "{{HOMEPAGE_VAR_PVE_TOKEN_ID}}"
          password: "{{HOMEPAGE_VAR_PVE_TOKEN_SECRET}}"
          node: hnhv02
    - OPNsense hnfw01:
        # Its own address, not the VIP 10.10.10.1: Pocket ID sign-in (os-sso) only works there.
        href: https://10.10.10.2
        siteMonitor: https://10.10.30.2
        icon: opnsense.svg
        description: Firewall (primary), Pocket ID sign-in
        proxmoxNode: hnhv01
        proxmoxVMID: 100
        widget:
          type: opnsense
          url: https://10.10.30.2
          username: "{{HOMEPAGE_VAR_OPNSENSE_HNFW01_KEY}}"
          password: "{{HOMEPAGE_VAR_OPNSENSE_HNFW01_SECRET}}"
    - OPNsense hnfw02:
        href: https://10.10.10.3
        siteMonitor: https://10.10.30.3
        icon: opnsense.svg
        description: Firewall (backup), Pocket ID sign-in
        proxmoxNode: hnhv02
        proxmoxVMID: 110
        widget:
          type: opnsense
          url: https://10.10.30.3
          username: "{{HOMEPAGE_VAR_OPNSENSE_HNFW02_KEY}}"
          password: "{{HOMEPAGE_VAR_OPNSENSE_HNFW02_SECRET}}"
    - Media NFS:
        icon: mdi-nas
        description: hnnfs01, /srv/media
        proxmoxNode: hnhv01
        proxmoxVMID: 401

# RSS/Atom, fetched by the pod. Add one: a service with widget type feed.
- News:
    - selfh.st:
        href: https://selfh.st
        icon: mdi-newspaper-variant
        widget:
          type: feed
          url: https://selfh.st/rss/
          maxItems: 5
          images: false
    - Hacker News:
        href: https://news.ycombinator.com
        icon: hacker-news.svg
        widget:
          type: feed
          url: https://hnrss.org/frontpage?points=200
          maxItems: 5
          images: false
    - Proxmox announcements:
        href: https://forum.proxmox.com/forums/announcements.7/
        icon: proxmox.svg
        widget:
          type: feed
          url: https://forum.proxmox.com/forums/announcements.7/index.rss
          maxItems: 5
          images: false
    - Talos releases:
        href: https://github.com/siderolabs/talos/releases
        icon: talos.svg
        widget:
          type: feed
          url: https://github.com/siderolabs/talos/releases.atom
          maxItems: 3
          images: false
    - Kubernetes releases:
        href: https://github.com/kubernetes/kubernetes/releases
        icon: kubernetes.svg
        widget:
          type: feed
          url: https://github.com/kubernetes/kubernetes/releases.atom
          maxItems: 3
          images: false
