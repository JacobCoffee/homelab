# href is what your browser opens; siteMonitor is checked from the pod (dot next to each link).
# Apps behind the passkey sign-in (network/lab-sso) are checked at their in-cluster Service: through
# the gateway they'd always answer 302 to the sign-in, up or not. Other *.z7x.org names resolve
# in-cluster to the internal gateway. Proxmox and OPNsense are checked by IP: their
# *.internal.z7x.org names are tailnet addresses pods can't reach.
#
# namespace + app: pod status and CPU/memory (label app.kubernetes.io/name=<app>).
# proxmoxNode + proxmoxVMID: the VM's or LXC's CPU/memory (nodes are defined in proxmox.yaml).
# widget: the app's own stats, talking to its in-cluster Service. {{HOMEPAGE_VAR_*}} values come
# from homepage-secrets (ansible/roles/homepage).
# Icons: https://dashboardicons.com (name.svg) or mdi-<name>.
- Media:
    - Jellyfin:
        href: https://media.z7x.org
        siteMonitor: https://media.z7x.org
        icon: jellyfin.svg
        description: Movies, TV, music
        namespace: media
        app: jellyfin
        widget:
          type: jellyfin
          url: http://jellyfin.media.svc.cluster.local:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          version: 2
          enableBlocks: true
          enableNowPlaying: true
    - Seerr:
        href: https://requests.z7x.org
        siteMonitor: https://requests.z7x.org
        icon: jellyseerr.svg
        description: Requests
        namespace: media
        app: seerr
        widget:
          type: seerr
          url: http://seerr.media.svc.cluster.local:5055
          key: "{{HOMEPAGE_VAR_SEERR_KEY}}"
          fields: [pending, approved, available]
    - Sonarr:
        href: https://sonarr.z7x.org
        siteMonitor: http://sonarr.media.svc.cluster.local:8989/ping
        icon: sonarr.svg
        description: TV
        namespace: media
        app: sonarr
        widget:
          type: sonarr
          url: http://sonarr.media.svc.cluster.local:8989
          key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
    - Radarr:
        href: https://radarr.z7x.org
        siteMonitor: http://radarr.media.svc.cluster.local:7878/ping
        icon: radarr.svg
        description: Movies
        namespace: media
        app: radarr
        widget:
          type: radarr
          url: http://radarr.media.svc.cluster.local:7878
          key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
    - Lidarr:
        href: https://lidarr.z7x.org
        siteMonitor: http://lidarr.media.svc.cluster.local:8686/ping
        icon: lidarr.svg
        description: Music
        namespace: media
        app: lidarr
        widget:
          type: lidarr
          url: http://lidarr.media.svc.cluster.local:8686
          key: "{{HOMEPAGE_VAR_LIDARR_KEY}}"
    - Bindery:
        href: https://bindery.z7x.org
        siteMonitor: http://bindery.media.svc.cluster.local:8787
        icon: mdi-book-open-variant
        description: Books
        namespace: media
        app: bindery
    - Bazarr:
        href: https://bazarr.z7x.org
        siteMonitor: http://bazarr.media.svc.cluster.local:6767
        icon: bazarr.svg
        description: Subtitles
        namespace: media
        app: bazarr
        widget:
          type: bazarr
          url: http://bazarr.media.svc.cluster.local:6767
          key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"

