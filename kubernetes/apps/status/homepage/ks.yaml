# Homepage (gethomepage.dev) start page at start.z7x.org: every lab app with status, pod and VM
# stats, app widgets and news feeds. Internal-only (tailnet/lab). Credentials come from
# ansible/roles/homepage (app/secret.sops.yaml); app/rbac.yaml is a read-only ClusterRole.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homepage
  namespace: flux-system
spec:
  targetNamespace: status
  path: ./kubernetes/apps/status/homepage/app
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: status-app-template
    - name: envoy-gateway-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: homepage
      namespace: status
