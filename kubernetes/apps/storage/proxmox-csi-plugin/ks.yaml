# Proxmox CSI plugin: provisions the proxmox-vmdata (default) and proxmox-fast StorageClasses
# by allocating/attaching Proxmox VM disks. ansible/roles/pve_csi creates the Proxmox user,
# role and API token and writes app/secret.sops.yaml; the talos role labels every node with
# topology.kubernetes.io/{region,zone}.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: proxmox-csi-plugin
  namespace: flux-system
spec:
  targetNamespace: csi-proxmox
  path: ./kubernetes/apps/storage/proxmox-csi-plugin/app
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: proxmox-csi-plugin
      namespace: csi-proxmox
