# DNS-01 via the Cloudflare API token in secret.sops.yaml (cert-manager namespace = cert-manager's
# cluster resource namespace, where ClusterIssuers look up secrets).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: "${ACME_EMAIL}"
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - z7x.org
---
# Cabotage's default cluster_issuer setting is the literal name "letsencrypt"; its tenant
# Ingresses expect that exact name, scoped to apps.z7x.org so it doesn't overlap the
# production wildcard issuer's ACME account state.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: "${ACME_EMAIL}"
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - apps.z7x.org
