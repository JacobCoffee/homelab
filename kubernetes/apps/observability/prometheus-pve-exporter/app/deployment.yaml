# Credentials (PVEAuditor token) come from secret.sops.yaml next to this file, written by
# ansible/roles/monitoring_pve. Connects to Proxmox nodes by LAN IP, not <node>.internal.z7x.org:
# that name only resolves over Tailscale/AdGuard split DNS, not from cluster pods (see pve_csi),
# so verify_ssl is off in pve.yml instead of depending on it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-pve-exporter
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-pve-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-pve-exporter
    spec:
      containers:
        - name: prometheus-pve-exporter
          image: prompve/prometheus-pve-exporter:3.11.0
          args:
            - --config.file=/etc/prometheus/pve.yml
          ports:
            - name: http
              containerPort: 9221
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: prometheus-pve-exporter-config
