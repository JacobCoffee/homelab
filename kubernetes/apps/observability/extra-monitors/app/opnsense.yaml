# OPNsense (hnfw01) runs os-node_exporter on :9100 (ansible/roles/opnsense/tasks/node_exporter.yml,
# which also opens it to the K8S zone). It isn't a Kubernetes Service, so it's a static target,
# scraped via its K8S-zone gateway address. The release label is what this Prometheus's
# scrapeConfigSelector matches.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: opnsense
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  jobName: opnsense
  scrapeInterval: 30s
  staticConfigs:
    - targets: ["10.10.30.1:9100"]
      labels:
        instance: hnfw01
