# Alerts not covered by kube-prometheus-stack's bundled kubernetes-mixin (which only knows about
# this Kubernetes cluster): Proxmox hosts/guests/storage, Flux reconciliation, backup jobs, and
# blackbox probes (public apps, Proxmox UI cert expiry, ZFS pool health).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-extra
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: proxmox
      rules:
        - alert: ProxmoxNodeDown
          expr: pve_up{id=~"node/.+"} == 0
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "Proxmox node {{ $labels.id }} is down"
        - alert: ProxmoxGuestDown
          expr: pve_up{id=~"qemu/.+|lxc/.+"} == 0
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Proxmox guest {{ $labels.id }} is down"
        - alert: ProxmoxStorageAlmostFull
          expr: pve_disk_usage_bytes{id=~"storage/.+"} / pve_disk_size_bytes{id=~"storage/.+"} > 0.85
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "Proxmox storage {{ $labels.id }} is over 85% full"

    - name: flux
      rules:
        # gotk_resource_info comes from kube-state-metrics' customResourceState (see the
        # kube-prometheus-stack values). Dependents of a broken object report DependencyNotReady;
        # they're left out so one failure is one alert. All broken objects share one Discord message
        # (no namespace label to split on), re-posted at most every 12h while still broken.
        - alert: FluxResourceNotReady
          expr: >-
            max by (customresource_kind, exported_namespace, name, reason) (
              gotk_resource_info{ready="False", suspended!="true", reason!="DependencyNotReady"}
            ) == 1
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "Flux {{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} not Ready ({{ $labels.reason }}) for 15m"
            description: "Check with: flux get {{ $labels.customresource_kind | toLower }} -n {{ $labels.exported_namespace }} {{ $labels.name }}"

    - name: backups
      rules:
        - alert: BackupJobFailed
          expr: kube_job_status_failed{namespace="backup"} > 0
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "Backup Job {{ $labels.job_name }} failed in namespace backup"
        # VolSync (the apps' nightly restic backups to R2, components/volsync). Its controller sets
        # volsync_volume_out_of_sync to 1 once a ReplicationSource misses its schedule, which with
        # the 04:00 daily schedule can take up to a day; a failing mover Job shows sooner.
        - alert: VolSyncBackupOutOfSync
          expr: max by (obj_namespace, obj_name) (volsync_volume_out_of_sync{role="source"}) == 1
          for: 30m
          labels: { severity: critical }
          annotations:
            summary: "Backup of {{ $labels.obj_namespace }}/{{ $labels.obj_name }} missed its schedule"
            description: "Check with: kubectl -n {{ $labels.obj_namespace }} describe replicationsource {{ $labels.obj_name }}"
        - alert: VolSyncMoverFailing
          expr: kube_job_status_failed{job_name=~"volsync-src-.*"} > 0
          for: 1h
          labels: { severity: warning }
          annotations:
            summary: "Backup mover {{ $labels.namespace }}/{{ $labels.job_name }} has failed pods for 1h"
            description: "Check with: kubectl -n {{ $labels.namespace }} logs job/{{ $labels.job_name }}"
        - alert: VolSyncMetricsMissing
          expr: absent(volsync_volume_out_of_sync)
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "No VolSync metrics: backup alerts can't fire (ServiceMonitor observability/volsync)"

    - name: firetv
      rules:
        # for: 1h, not 5m like BackupJobFailed: the firetv-reapply CronJob exits 0 (success) when
        # the stick is unreachable (powered off), so a failed Job here is a real script/pm/adb
        # error, not a flaky/offline TV -- but one real transient failure still shouldn't page
        # before the next 5m schedule has a chance to self-heal.
        - alert: FireTvReapplyFailing
          expr: kube_job_status_failed{namespace="firetv"} > 0
          for: 1h
          labels: { severity: warning }
          annotations:
            summary: "Fire TV reapply Job {{ $labels.job_name }} failed in namespace firetv"

    - name: blackbox
      rules:
        - alert: ProbeFailing
          expr: probe_success == 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Blackbox probe {{ $labels.instance }} (job {{ $labels.job }}) is failing"
        - alert: CertificateExpiringSoon
          expr: probe_ssl_earliest_cert_expiry - time() < 14 * 86400
          for: 1h
          labels: { severity: warning }
          annotations:
            summary: "TLS certificate for {{ $labels.instance }} expires in under 14 days"
