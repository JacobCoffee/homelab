# No postBuild substitution: dashboard JSON is full of Grafana ${...} variables (e.g.
# ${DS_PROMETHEUS}) that Flux would try, and fail, to substitute. force: the git-sync Job is
# immutable, so Flux recreates it whenever its spec or (hash-named) script changes; wait: the
# Kustomization is Ready only once that Job has seen a healthy first sync.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-dashboards
  namespace: flux-system
spec:
  targetNamespace: observability
  path: ./kubernetes/apps/observability/grafana-dashboards/app
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  dependsOn:
    - name: kube-prometheus-stack
  sourceRef:
    kind: GitRepository
    name: flux-system
  force: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
