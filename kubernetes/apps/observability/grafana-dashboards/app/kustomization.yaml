# Dashboards in ./dashboards/ are owned by Grafana Git Sync, not the sidecar: Grafana polls
# JacobCoffee/homelab (main) through the grafana-z7x-git-sync GitHub App and loads every JSON file
# under that path into a "Homelab" folder, one subfolder per directory (title and stable UID from
# each directory's _folder.json). Saving one of these dashboards in the UI pushes a branch and
# opens a PR; nothing lands on main without a merge.
#
# This Kustomization only registers that wiring: git-sync.py upserts the Connection (GitHub App
# credentials from grafana-git-sync) and Repository through Grafana's provisioning API, then waits
# for the first sync. See kubernetes/README.md "Dashboards (Grafana Git Sync)".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - ./secret.sops.yaml
  - ./git-sync-job.yaml
configMapGenerator:
  - name: grafana-git-sync-script
    files:
      - ./git-sync.py
