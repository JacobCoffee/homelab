# kube-prometheus-stack over VictoriaMetrics: at this scale (3 nodes, ~30-50 pods, a handful of
# exporters) the extra RAM/CPU of Prometheus+Alertmanager+Grafana is negligible against 12/12/8 GB
# nodes, and the chart's CRDs (ServiceMonitor/PodMonitor/PrometheusRule/Probe), bundled alert
# rules (kubernetes-mixin) and huge community-dashboard ecosystem are worth more here than the
# smaller footprint VictoriaMetrics would buy. Retention and requests are trimmed to match.
#
# kubeControllerManager/kubeScheduler/kubeProxy/kubeEtcd are disabled: Talos doesn't expose them
# the kubeadm way (no Service, no reachable metrics port), and Cilium replaces kube-proxy
# entirely, so those default ServiceMonitors would just sit permanently down.
#
# Alertmanager: Discord only (no email -- see kubernetes/README.md). The webhook URL is mounted
# from secret.sops.yaml next to this file (alertmanagerSpec.secrets) and referenced by file path,
# so it never appears in this HelmRelease.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "92.17.0"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: observability
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    crds:
      enabled: true

    kubeControllerManager: { enabled: false }
    kubeScheduler: { enabled: false }
    kubeProxy: { enabled: false }
    kubeEtcd: { enabled: false }

    defaultRules:
      rules:
        etcd: false
        kubeProxy: false
        kubeScheduler: false
        kubeControllerManager: false

    prometheus-node-exporter:
      resources:
        requests: { cpu: 20m, memory: 32Mi }
        limits: { memory: 64Mi }

    kube-state-metrics:
      resources:
        requests: { cpu: 20m, memory: 64Mi }
        limits: { memory: 128Mi }
      # Flux's controllers no longer export readiness (gotk_reconcile_condition is gone since Flux
      # 2.1); per Flux's monitoring guide, kube-state-metrics turns the Flux objects' Ready
      # condition into gotk_resource_info{ready="True|False|Unknown", suspended=...}. The
      # FluxResourceNotReady rule (extra-monitors) alerts on it, replacing per-event Discord posts.
      rbac:
        extraRules:
          - apiGroups:
              - source.toolkit.fluxcd.io
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
            resources: ["*"]
            verbs: [list, watch]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind: { group: kustomize.toolkit.fluxcd.io, version: v1, kind: Kustomization }
                metricNamePrefix: gotk
                metrics: &flux_metrics
                  - name: resource_info
                    help: The current state of a Flux resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      reason: [status, conditions, "[type=Ready]", reason]
                      suspended: [spec, suspend]
              - groupVersionKind: { group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease }
                metricNamePrefix: gotk
                metrics: *flux_metrics
              - groupVersionKind: { group: source.toolkit.fluxcd.io, version: v1, kind: GitRepository }
                metricNamePrefix: gotk
                metrics: *flux_metrics
              - groupVersionKind: { group: source.toolkit.fluxcd.io, version: v1, kind: OCIRepository }
                metricNamePrefix: gotk
                metrics: *flux_metrics
              - groupVersionKind: { group: source.toolkit.fluxcd.io, version: v1, kind: HelmRepository }
                metricNamePrefix: gotk
                metrics: *flux_metrics

    prometheus:
      prometheusSpec:
        # Mimir (../mimir) now holds the long-term history via remote_write below; Prometheus
        # itself only needs enough local retention to survive a Mimir outage/restart.
        retention: 3d
        replicas: 1
        resources:
          requests: { cpu: 100m, memory: 512Mi }
          limits: { memory: 1Gi }
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: proxmox-fast
              accessModes: ["ReadWriteOnce"]
              # Sized for 3d, not 10d: shrinking this spec doesn't shrink the already-bound 20Gi
              # PVC (PVCs only grow), it only matters for a fresh install.
              resources:
                requests: { storage: 10Gi }
        remoteWrite:
          - url: http://mimir.observability.svc.cluster.local:8080/api/v1/push
            # Mimir holds metric history; its multitenancy_enabled is false (single tenant), so no
            # X-Scope-OrgID header is needed -- turning multi-tenancy on later only means adding
            # one here.
        # Pick up ServiceMonitors/PodMonitors/PrometheusRules/Probes from any namespace, not just
        # ones carrying this release's Helm labels (extra-monitors, pve-exporter, adguard-exporter
        # all live outside this chart's release).
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorNamespaceSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorNamespaceSelector: {}
        probeSelectorNilUsesHelmValues: false
        probeNamespaceSelector: {}
        ruleSelectorNilUsesHelmValues: false
        ruleNamespaceSelector: {}

    alertmanager:
      alertmanagerSpec:
        replicas: 1
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { memory: 96Mi }
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: proxmox-fast
              accessModes: ["ReadWriteOnce"]
              resources:
                requests: { storage: 2Gi }
        # discord-webhook-url key, mounted at /etc/alertmanager/secrets/alertmanager-discord-webhook/
        secrets:
          - alertmanager-discord-webhook
      config:
        route:
          receiver: discord
          group_by: ["alertname", "namespace"]
          group_wait: 30s
          group_interval: 5m
          # A still-broken thing re-posts twice a day, not every few hours.
          repeat_interval: 12h
          routes:
            # Watchdog is the "alerting pipeline is alive" heartbeat, not an incident;
            # InfoInhibitor and info/none-severity rules are context, not pages.
            - receiver: "null"
              matchers:
                - alertname =~ "Watchdog|InfoInhibitor"
            - receiver: "null"
              matchers:
                - severity =~ "info|none|"
        receivers:
          - name: "null"
          - name: discord
            discord_configs:
              - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord-webhook/discord-webhook-url
                send_resolved: true

    grafana:
      admin:
        existingSecret: grafana-admin-credentials
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        type: pvc
        storageClassName: proxmox-vmdata
        accessModes: ["ReadWriteOnce"]
        size: 2Gi
      # RWO volume: a rolling update deadlocks when the new pod lands on another node, because the
      # volume stays attached to the old pod. Recreate stops the old pod first.
      # rollingUpdate: null is required, not just omitted: the live Deployment still carries the
      # old RollingUpdate strategy's rollingUpdate block from before this switch, and Kubernetes
      # rejects strategy.rollingUpdate alongside type: Recreate. An explicit null in the applied
      # manifest tells server-side apply to clear that field instead of leaving it untouched.
      deploymentStrategy:
        type: Recreate
        rollingUpdate: null
      resources:
        requests: { cpu: 50m, memory: 192Mi }
        limits: { memory: 640Mi }
      grafana.ini:
        server:
          root_url: https://grafana.z7x.org
      sidecar:
        dashboards:
          # Lets ../grafana-dashboards' per-folder ConfigMaps (annotation grafana_folder) land in
          # their own Grafana folders instead of all piling into General.
          folderAnnotation: grafana_folder
          provider:
            foldersFromFilesStructure: true
      # Loads the grafana.com downloads under dashboards.default below; without a provider for
      # that group the chart downloads them and nothing ever reads the directory.
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: default
              orgId: 1
              folder: Imported
              type: file
              disableDeletion: true
              editable: false
              options:
                path: /var/lib/grafana/dashboards/default
        datasources:
          # Mimir (below) is the new default; this chart's own auto-provisioned "Prometheus"
          # datasource (still pointing at this release's own Prometheus) stays, just not default.
          isDefaultDatasource: false
      # Mimir is single-tenant (multitenancy_enabled: false, see ../mimir/app/mimir.yaml) so no
      # X-Scope-OrgID header is set here; Loki likewise (auth_enabled: false, see ../loki). Neither
      # URL encodes a tenant, so enabling multi-tenancy later is a datasource-only edit.
      additionalDataSources:
        - name: Mimir
          type: prometheus
          uid: mimir
          access: proxy
          url: http://mimir.observability.svc.cluster.local:8080/prometheus
          isDefault: true
          jsonData:
            httpMethod: POST
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://loki.observability.svc.cluster.local:3100
          isDefault: false
        # Cabotage runs its own standalone Mimir/Loki (multi-tenant, X-Scope-OrgID required);
        # read-only viewing here, not wired into alerting. tlsSkipVerify is a deliberate gap:
        # Cabotage's internal mTLS CA isn't plumbed into Grafana's trust store.
        - name: Cabotage Mimir
          type: prometheus
          uid: cabotage-mimir
          access: proxy
          url: https://resident-mimir-read.cabotage.svc.cluster.local:8080/prometheus
          isDefault: false
          jsonData:
            httpMethod: POST
            httpHeaderName1: X-Scope-OrgID
            tlsSkipVerify: true
          secureJsonData:
            httpHeaderValue1: cabotage-infra|anonymous
        - name: Cabotage Loki
          type: loki
          uid: cabotage-loki
          access: proxy
          url: https://resident-loki-read.cabotage.svc.cluster.local:3100
          isDefault: false
          jsonData:
            httpHeaderName1: X-Scope-OrgID
            tlsSkipVerify: true
          secureJsonData:
            httpHeaderValue1: cabotage-infra|anonymous
      # Downloaded straight from grafana.com by the chart's dashboard sidecar init container.
      dashboards:
        default:
          node-exporter-full:
            gnetId: 1860
            revision: 46
            datasource: Prometheus
          kubernetes-views-global:
            gnetId: 15757
            revision: 43
            datasource: Prometheus
          proxmox-via-prometheus:
            gnetId: 10347
            revision: 5
            datasource: Prometheus
          flux2:
            gnetId: 16714
            revision: 1
            datasource: Prometheus
          cilium-agent-metrics:
            gnetId: 16611
            revision: 1
            datasource: Prometheus
