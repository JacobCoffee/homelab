# Internal-only: Grafana exposes cluster/host metrics, no reason to put it on the internet.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  hostnames:
    - grafana.z7x.org
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
