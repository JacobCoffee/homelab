# Blocked on vault_discord_webhook_url (ansible vault) -- secret.sops.yaml doesn't exist yet, so
# this Kustomization will show NotReady (decryption source missing) until it's added and
# ansible-playbook site.yml --tags notify / the matching k8s secret has been created and committed.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-notifications
  namespace: flux-system
spec:
  targetNamespace: flux-system
  path: ./kubernetes/apps/observability/flux-notifications/app
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
