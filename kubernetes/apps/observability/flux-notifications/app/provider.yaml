# address key lives in secret.sops.yaml (vault_discord_webhook_url). The controller posts to the
# webhook's /slack endpoint, formatted as a Slack message -- see fluxcd.io/flux/components/
# notification/providers/#discord.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: discord
  namespace: flux-system
spec:
  type: discord
  secretRef:
    name: flux-discord-webhook
