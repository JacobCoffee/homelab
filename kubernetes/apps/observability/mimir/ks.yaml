apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mimir
  namespace: flux-system
spec:
  targetNamespace: observability
  path: ./kubernetes/apps/observability/mimir/app
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  dependsOn:
    # ServiceMonitor CRD.
    - name: kube-prometheus-stack
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  healthChecks:
    - apiVersion: apps/v1
      kind: StatefulSet
      name: mimir
      namespace: observability
