# Module config (incl. the PVE API token used by the pve_zfs_health module) lives entirely in
# secret.sops.yaml -- ansible/roles/monitoring_pve writes it, keyed blackbox.yaml, next to this
# file. configExistingSecretName also avoids Helm's toYaml round-trip, which the chart's own
# values.yaml warns corrupts non-ASCII bytes in module config.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: "11.20.2"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: observability
  values:
    configExistingSecretName: blackbox-exporter-config
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 64Mi }
