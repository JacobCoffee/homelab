# Pool for every Service of type LoadBalancer (Envoy Gateway's two Gateways, and anything else that
# wants an IP) in the agreed 10.10.30.200-250 range.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: default
spec:
  blocks:
    - start: 10.10.30.200
      stop: 10.10.30.250
