apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrepository.yaml
  - ./helmrelease.yaml
# Wraps helm-values.yaml (owned by whoever ran the initial `helm install`) in a ConfigMap so the
# HelmRelease below can load it via valuesFrom. disableNameSuffixHash keeps the generated name stable
# so it doesn't need updating every time helm-values.yaml changes.
configMapGenerator:
  - name: cilium-helm-values
    files:
      - values.yaml=helm-values.yaml
generatorOptions:
  disableNameSuffixHash: true
