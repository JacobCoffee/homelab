# Talos stores containerd registry config outside the OCI default path; the matching
# `discard_unpacked_layers = false` machine-config patch is required too (see FluxApps' report).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
  namespace: kube-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: spegel
  values:
    spegel:
      containerdRegistryConfigPath: /etc/cri/conf.d/hosts
