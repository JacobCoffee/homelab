# Auto-approves kubelet-serving CSRs now that Talos has `rotate-server-certificates: true` set, so
# metrics-server (and anything else) gets a trusted kubelet TLS cert instead of needing --kubelet-insecure-tls.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubelet-csr-approver
  namespace: kube-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kubelet-csr-approver
  values:
    # Only approve CSRs whose SAN matches a node name or its lab-zone IP (k8s_nodes in
    # ansible/inventory/group_vars/all/main.yml: hnk8s01-09, 10.10.30.11-19).
    providerRegex: '^(hnk8s0[1-9]|10\.10\.30\.1[1-9])$'
    allowedDnsNames: 1
    bypassDnsResolution: false
