# Internal only: flux.z7x.org on the lab/tailnet gateway (external-dns-adguard publishes it). The
# UI does its own OIDC, so no lab-sso SecurityPolicy here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-web
spec:
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  hostnames:
    - flux.z7x.org
  rules:
    - backendRefs:
        - name: flux-web
          port: 9080
