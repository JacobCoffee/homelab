# Pocket ID's groups claim carries lab-admins; the web UI impersonates it as a Kubernetes group.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-web-lab-admins
subjects:
  - kind: Group
    name: lab-admins
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: flux-web-admin
  apiGroup: rbac.authorization.k8s.io
