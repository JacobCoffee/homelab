# qBittorrent behind a gluetun VPN sidecar (same Pod, so they share a network namespace --
# gluetun owns it and firewalls it; qBittorrent rides inside with no network config of its own).
# The AirVPN WireGuard credentials live in app/secret.sops.yaml; the Ansible vault
# (vault_vpn_*) is the source of truth for them.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gluetun-qbittorrent
  namespace: flux-system
spec:
  targetNamespace: media
  path: ./kubernetes/apps/media/gluetun-qbittorrent/app
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: media-app-template
    - name: envoy-gateway-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
