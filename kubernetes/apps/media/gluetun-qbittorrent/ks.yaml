# qBittorrent behind a gluetun VPN sidecar (same Pod, so they share a network namespace --
# gluetun owns it and firewalls it; qBittorrent rides inside with no network config of its own).
# This is the only Kustomization waiting on a vault secret: vault_vpn_wireguard_private_key,
# vault_vpn_wireguard_preshared_key, vault_vpn_wireguard_addresses and vault_vpn_forwarded_port
# don't exist yet (AirVPN account not created). Until secret.sops.yaml is updated with real
# values, the gluetun container CrashLoopBackOffs on bad WireGuard config; everything else in
# this Kustomization (the qBittorrent container, PVC, Service, Route) still applies cleanly.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gluetun-qbittorrent
  namespace: flux-system
spec:
  targetNamespace: media
  path: ./kubernetes/apps/media/gluetun-qbittorrent/app
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: media-app-template
    - name: envoy-gateway-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
