# gluetun (ghcr.io/qdm12/gluetun v3.41.3) and qBittorrent (ghcr.io/home-operations/qbittorrent
# 5.3.0) in one Pod/controller so they share a network namespace: gluetun owns it, firewalls it
# (kill switch -- only the WireGuard tunnel, DNS, and the cluster's own pod/service subnets get
# through), and qBittorrent rides inside with no network settings of its own.
#
# AirVPN, static port forwarding: FIREWALL_VPN_INPUT_PORTS and qBittorrent's --torrenting-port
# both come from the same FORWARDED_PORT secret key, so the two always agree (see secret.sops.yaml
# for where the real values come from once the AirVPN account exists).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gluetun-qbittorrent
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      qbittorrent:
        containers:
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: "v3.41.3"
            env:
              TZ: America/Chicago
              VPN_SERVICE_PROVIDER: airvpn
              VPN_TYPE: wireguard
              SERVER_COUNTRIES: United States
              FIREWALL_OUTBOUND_SUBNETS: 10.244.0.0/16,10.96.0.0/12
              WIREGUARD_PRIVATE_KEY:
                valueFrom:
                  secretKeyRef:
                    name: gluetun-secret
                    key: WIREGUARD_PRIVATE_KEY
              WIREGUARD_PRESHARED_KEY:
                valueFrom:
                  secretKeyRef:
                    name: gluetun-secret
                    key: WIREGUARD_PRESHARED_KEY
              WIREGUARD_ADDRESSES:
                valueFrom:
                  secretKeyRef:
                    name: gluetun-secret
                    key: WIREGUARD_ADDRESSES
              FIREWALL_VPN_INPUT_PORTS:
                valueFrom:
                  secretKeyRef:
                    name: gluetun-secret
                    key: FORWARDED_PORT
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              readOnlyRootFilesystem: false
              capabilities:
                add: ["NET_ADMIN"]
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: "5.3.0"
            env:
              TZ: America/Chicago
              FORWARDED_PORT:
                valueFrom:
                  secretKeyRef:
                    name: gluetun-secret
                    key: FORWARDED_PORT
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
            args:
              - "--webui-port=8080"
              - "--torrenting-port=$(FORWARDED_PORT)"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  initialDelaySeconds: 15
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: qbittorrent
        ports:
          http:
            port: *port
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: proxmox-vmdata
        accessMode: ReadWriteOnce
        size: 2Gi
        advancedMounts:
          qbittorrent:
            app:
              - path: /config
      media:
        type: nfs
        server: "${MEDIA_NFS_SERVER}"
        path: "${MEDIA_NFS_PATH}"
        advancedMounts:
          qbittorrent:
            app:
              - path: /media
    route:
      app:
        hostnames: ["qbittorrent.z7x.org"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
