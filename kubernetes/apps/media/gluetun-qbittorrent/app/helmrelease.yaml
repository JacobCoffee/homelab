# gluetun (ghcr.io/qdm12/gluetun v3.41.3) and qBittorrent (ghcr.io/home-operations/qbittorrent
# 5.2.4) in one Pod/controller so they share a network namespace: gluetun owns it, firewalls it
# (kill switch -- only the WireGuard tunnel, DNS, and the cluster's own pod/service subnets get
# through), and qBittorrent rides inside with no network settings of its own.
#
# qBittorrent stays on 5.2.x: MyAnonamouse doesn't allow 5.3.x yet (.github/renovate.json5 holds
# it back; lift that once MAM's client list accepts 5.3).
#
# AirVPN, static port forwarding: FIREWALL_VPN_INPUT_PORTS and qBittorrent's --torrenting-port
# both come from the same FORWARDED_PORT secret key, so the two always agree. FIREWALL_INPUT_PORTS
# opens the web UI on the pod interface (eth0) for kubelet probes and the Service; gluetun drops
# all other inbound traffic there.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gluetun-qbittorrent
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      qbittorrent:
        # One AirVPN key can only be connected once: never run the old and new pod together.
        strategy: Recreate
        initContainers:
          # Sign-in is the gateway's passkey check (network/lab-sso), so the web UI skips its own
          # login for the pod network only (AuthSubnetWhitelist 10.244.0.0/16: Envoy's pod IPs, and
          # the media/status/observability pods the lab-sso-ingress policy lets in). The image's
          # default bypassed every RFC1918 client, including the whole tailnet/lab; this rewrites
          # the WebUI settings on every start because qBittorrent can't take them as flags. The
          # admin login from gluetun-secret stays for anything outside that subnet. 5.2 reads them
          # from [Preferences] as WebUI\*, 5.3+ from [WebUI]: both are written, so moving between
          # versions never falls back to the image's bypass or to no password at all. (No ${...}
          # in the script: Flux postBuild substitution would rewrite it.)
          #
          # [BitTorrent] is bound to gluetun's tun0: qBittorrent starts alongside gluetun, before
          # the tunnel exists, and unbound it only ever listened on eth0/lo, so its peer and DHT
          # traffic left with the pod address, which the tunnel can't carry (0 DHT nodes, always
          # "firewalled"). Bound, it waits for tun0 and follows it across reconnects.
          harden-webui:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: "5.2.4"
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                f=/config/qBittorrent/qBittorrent.conf
                mkdir -p /config/qBittorrent
                [ -f "$f" ] || cp /defaults/qBittorrent.conf "$f"
                # ensure SECTION KEY=VALUE...: set these keys in [SECTION], adding it if missing.
                ensure() {
                  SEC=$1
                  shift
                  WANT=$(printf '%s\n' "$@")
                  export SEC WANT
                  awk '
                    BEGIN { sec = ENVIRON["SEC"]; n = split(ENVIRON["WANT"], L, "\n")
                            for (i = 1; i <= n; i++) { k = substr(L[i], 1, index(L[i], "=") - 1); v[k] = L[i]; ord[i] = k } }
                    function flush(j) { for (j = 1; j <= n; j++) if (!(ord[j] in seen)) print v[ord[j]]; flushed = 1 }
                    /^\[.*\]$/ { if (cur == sec) flush(); cur = substr($0, 2, length($0) - 2); if (cur == sec) found = 1; print; next }
                    cur == sec { k = substr($0, 1, index($0, "=") - 1); if (k in v) { print v[k]; seen[k] = 1; next } }
                    { print }
                    END { if (cur == sec && !flushed) flush()
                          if (!found) { print ""; print "[" sec "]"; for (j = 1; j <= n; j++) print v[ord[j]] } }
                  ' "$f" > "$f.new"
                  mv "$f.new" "$f"
                }
                pw="\"$QBT_WEBUI_PASSWORD_PBKDF2\""
                ensure WebUI AuthSubnetWhitelistEnabled=true AuthSubnetWhitelist=10.244.0.0/16 \
                  LocalHostAuth=true CSRFProtection=true Username=admin "Password_PBKDF2=$pw"
                ensure Preferences 'WebUI\AuthSubnetWhitelistEnabled=true' 'WebUI\AuthSubnetWhitelist=10.244.0.0/16' \
                  'WebUI\LocalHostAuth=true' 'WebUI\CSRFProtection=true' 'WebUI\Username=admin' "WebUI\\Password_PBKDF2=$pw"
                ensure BitTorrent 'Session\Interface=tun0' 'Session\InterfaceName=tun0'
                grep -E '^(WebUI\\)?(AuthSubnetWhitelist|AuthSubnetWhitelistEnabled|LocalHostAuth|CSRFProtection|Username)=|^Session\\Interface(Name)?=' "$f"
            env:
              QBT_WEBUI_PASSWORD_PBKDF2:
                valueFrom:
                  secretKeyRef:
                    name: gluetun-secret
                    key: QBT_WEBUI_PASSWORD_PBKDF2
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
        containers:
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: "v3.41.3"
            # Before every start (container restarts keep the pod's network namespace):
            # - gluetun treats any IPv6 route as working IPv6 (netlink.IsIPv6Supported); the pod's
            #   link-local fe80::/64 counts, and so do the tun0 routes a previous run left, so it
            #   picks AirVPN IPv6 endpoints the IPv4-only cluster can't reach. Flush them.
            # - A previous run's table-51820 rules make it fail with "adding IPv6 rule ... file
            #   exists" (gluetun wiki, Kubernetes: delete them on start).
            command:
              - sh
              - -c
              - >-
                ip rule del table 51820 2>/dev/null; ip -6 rule del table 51820 2>/dev/null;
                ip -6 route flush table main; ip -6 route flush table 51820 2>/dev/null;
                exec /gluetun-entrypoint
            env:
              TZ: America/Chicago
              VPN_SERVICE_PROVIDER: airvpn
              VPN_TYPE: wireguard
              SERVER_COUNTRIES: United States
              # AirVPN's NYC servers all exit through one network (AS11878, tzulo), and the
              # MyAnonamouse seedbox session is ASN-locked: a reconnect to another US city lands
              # on another network, which MAM rejects ("Invalid session - ASN mismatch").
              SERVER_CITIES: New York City
              FIREWALL_OUTBOUND_SUBNETS: 10.244.0.0/16,10.96.0.0/12
              FIREWALL_INPUT_PORTS: "8080"
              WIREGUARD_PRIVATE_KEY:
                valueFrom:
                  secretKeyRef:
                    name: gluetun-secret
                    key: WIREGUARD_PRIVATE_KEY
              WIREGUARD_PRESHARED_KEY:
                valueFrom:
                  secretKeyRef:
                    name: gluetun-secret
                    key: WIREGUARD_PRESHARED_KEY
              WIREGUARD_ADDRESSES:
                valueFrom:
                  secretKeyRef:
                    name: gluetun-secret
                    key: WIREGUARD_ADDRESSES
              FIREWALL_VPN_INPUT_PORTS:
                valueFrom:
                  secretKeyRef:
                    name: gluetun-secret
                    key: FORWARDED_PORT
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              readOnlyRootFilesystem: false
              capabilities:
                add: ["NET_ADMIN"]
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: "5.2.4"
            env:
              TZ: America/Chicago
              FORWARDED_PORT:
                valueFrom:
                  secretKeyRef:
                    name: gluetun-secret
                    key: FORWARDED_PORT
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
            args:
              - "--webui-port=8080"
              - "--torrenting-port=$(FORWARDED_PORT)"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  initialDelaySeconds: 15
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
          # MyAnonamouse only accepts announces from an IP registered to the account. This pod's
          # exit is AirVPN's and changes on reconnect, so whenever gluetun reports a new public
          # IP, this tells MAM's dynamic seedbox API (it rate limits changes to one an hour; a
          # refused call is retried). It shares the pod's network, so the call itself leaves
          # through the tunnel, which is how MAM learns the IP. The session (MAM_SEEDBOX_ID,
          # created with "allow dynamic seedbox") comes from scripts/media-secrets.py as a
          # mounted file, and the cookie MAM may rotate is kept on the config PVC.
          mam-seedbox:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: "5.2.4"
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -u
                dir=/config/mam
                mkdir -p "$dir"
                last=""
                while :; do
                  id=$(cat /mam/MAM_SEEDBOX_ID 2>/dev/null)
                  ip=$(curl -s -m 10 http://127.0.0.1:8000/v1/publicip/ip | sed -n 's/.*"public_ip":"\([^"]*\)".*/\1/p')
                  if [ -z "$id" ]; then
                    echo "no MAM_SEEDBOX_ID yet"
                  elif [ -n "$ip" ] && [ "$ip" != "$last" ]; then
                    # A new session from the vault replaces the stored cookie.
                    if [ "$(cat "$dir/source" 2>/dev/null)" != "$id" ]; then
                      printf '.myanonamouse.net\tTRUE\t/\tTRUE\t0\tmam_id\t%s\n' "$id" > "$dir/cookies"
                      printf '%s' "$id" > "$dir/source"
                    fi
                    resp=$(curl -s -m 30 -b "$dir/cookies" -c "$dir/cookies" https://t.myanonamouse.net/json/dynamicSeedbox.php)
                    echo "$(date -Is) $ip: $resp"
                    case "$resp" in *'"Success":true'* | *'"Success": true'*) last=$ip ;; esac
                  fi
                  sleep 300
                done
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      # The pod resolves through gluetun (127.0.0.1). For <name>.int.z7x.org it answers NOERROR
      # with no records instead of NXDOMAIN, and musl (qBittorrent's image) stops searching at the
      # first NOERROR, so with the default ndots:5 every tracker/DHT lookup walked the search list
      # into that and failed ("bad address"). ndots:1 looks dotted names up as written first.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
    service:
      app:
        controller: qbittorrent
        ports:
          http:
            port: *port
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: proxmox-vmdata
        accessMode: ReadWriteOnce
        size: 2Gi
        advancedMounts:
          qbittorrent:
            harden-webui:
              - path: /config
            app:
              - path: /config
            mam-seedbox:
              - path: /config
      mam-seedbox:
        type: secret
        name: gluetun-secret
        items:
          - key: MAM_SEEDBOX_ID
            path: MAM_SEEDBOX_ID
        advancedMounts:
          qbittorrent:
            mam-seedbox:
              - path: /mam
                readOnly: true
      media:
        type: nfs
        server: "${MEDIA_NFS_SERVER}"
        path: "${MEDIA_NFS_PATH}"
        advancedMounts:
          qbittorrent:
            app:
              - path: /media
    route:
      app:
        hostnames: ["qbittorrent.z7x.org"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
