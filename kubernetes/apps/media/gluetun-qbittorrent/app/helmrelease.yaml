# gluetun (ghcr.io/qdm12/gluetun v3.41.3) and qBittorrent (ghcr.io/home-operations/qbittorrent
# 5.3.0) in one Pod/controller so they share a network namespace: gluetun owns it, firewalls it
# (kill switch -- only the WireGuard tunnel, DNS, and the cluster's own pod/service subnets get
# through), and qBittorrent rides inside with no network settings of its own.
#
# AirVPN, static port forwarding: FIREWALL_VPN_INPUT_PORTS and qBittorrent's --torrenting-port
# both come from the same FORWARDED_PORT secret key, so the two always agree. FIREWALL_INPUT_PORTS
# opens the web UI on the pod interface (eth0) for kubelet probes and the Service; gluetun drops
# all other inbound traffic there.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gluetun-qbittorrent
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      qbittorrent:
        initContainers:
          # The image's default config skips web UI auth for every RFC1918 client
          # (AuthSubnetWhitelist), and all traffic arrives from Envoy's pod IPs, so anyone on the
          # tailnet/lab was logged in automatically. qBittorrent can't take these settings as flags,
          # so this rewrites [WebUI] on every start: no subnet bypass, localhost auth and CSRF
          # protection on, and the login from gluetun-secret. It also drops the image's legacy
          # [Preferences] WebUI\* defaults so a fresh PVC can't migrate the bypass back in.
          # (No ${...} in the script: Flux postBuild substitution would rewrite it.)
          harden-webui:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: "5.3.0"
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                f=/config/qBittorrent/qBittorrent.conf
                mkdir -p /config/qBittorrent
                [ -f "$f" ] || cp /defaults/qBittorrent.conf "$f"
                WANT="AuthSubnetWhitelistEnabled=false
                LocalHostAuth=true
                CSRFProtection=true
                Username=admin
                Password_PBKDF2=\"$QBT_WEBUI_PASSWORD_PBKDF2\""
                export WANT
                awk '
                  BEGIN { n = split(ENVIRON["WANT"], L, "\n")
                          for (i = 1; i <= n; i++) { sub(/^[ \t]+/, "", L[i]); k = substr(L[i], 1, index(L[i], "=") - 1); v[k] = substr(L[i], index(L[i], "=") + 1); ord[i] = k } }
                  function flush(j) { for (j = 1; j <= n; j++) if (!(ord[j] in seen)) print ord[j] "=" v[ord[j]]; flushed = 1 }
                  /^\[.*\]$/ { if (sec == "WebUI") flush(); sec = substr($0, 2, length($0) - 2); if (sec == "WebUI") web = 1; print; next }
                  /^WebUI\\/ { next }
                  sec == "WebUI" { k = substr($0, 1, index($0, "=") - 1); if (k in v) { print k "=" v[k]; seen[k] = 1; next } }
                  { print }
                  END { if (sec == "WebUI" && !flushed) flush()
                        if (!web) { print ""; print "[WebUI]"; for (j = 1; j <= n; j++) print ord[j] "=" v[ord[j]] } }
                ' "$f" > "$f.new"
                mv "$f.new" "$f"
                grep -E '^(AuthSubnetWhitelistEnabled|LocalHostAuth|CSRFProtection|Username)=' "$f"
            env:
              QBT_WEBUI_PASSWORD_PBKDF2:
                valueFrom:
                  secretKeyRef:
                    name: gluetun-secret
                    key: QBT_WEBUI_PASSWORD_PBKDF2
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
        containers:
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: "v3.41.3"
            env:
              TZ: America/Chicago
              VPN_SERVICE_PROVIDER: airvpn
              VPN_TYPE: wireguard
              SERVER_COUNTRIES: United States
              FIREWALL_OUTBOUND_SUBNETS: 10.244.0.0/16,10.96.0.0/12
              FIREWALL_INPUT_PORTS: "8080"
              WIREGUARD_PRIVATE_KEY:
                valueFrom:
                  secretKeyRef:
                    name: gluetun-secret
                    key: WIREGUARD_PRIVATE_KEY
              WIREGUARD_PRESHARED_KEY:
                valueFrom:
                  secretKeyRef:
                    name: gluetun-secret
                    key: WIREGUARD_PRESHARED_KEY
              WIREGUARD_ADDRESSES:
                valueFrom:
                  secretKeyRef:
                    name: gluetun-secret
                    key: WIREGUARD_ADDRESSES
              FIREWALL_VPN_INPUT_PORTS:
                valueFrom:
                  secretKeyRef:
                    name: gluetun-secret
                    key: FORWARDED_PORT
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              readOnlyRootFilesystem: false
              capabilities:
                add: ["NET_ADMIN"]
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: "5.3.0"
            env:
              TZ: America/Chicago
              FORWARDED_PORT:
                valueFrom:
                  secretKeyRef:
                    name: gluetun-secret
                    key: FORWARDED_PORT
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
            args:
              - "--webui-port=8080"
              - "--torrenting-port=$(FORWARDED_PORT)"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  initialDelaySeconds: 15
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: qbittorrent
        ports:
          http:
            port: *port
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: proxmox-vmdata
        accessMode: ReadWriteOnce
        size: 2Gi
        advancedMounts:
          qbittorrent:
            harden-webui:
              - path: /config
            app:
              - path: /config
      media:
        type: nfs
        server: "${MEDIA_NFS_SERVER}"
        path: "${MEDIA_NFS_PATH}"
        advancedMounts:
          qbittorrent:
            app:
              - path: /media
    route:
      app:
        hostnames: ["qbittorrent.z7x.org"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
