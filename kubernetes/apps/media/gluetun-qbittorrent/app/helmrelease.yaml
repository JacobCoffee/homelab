# gluetun (ghcr.io/qdm12/gluetun v3.41.3) and qBittorrent (ghcr.io/home-operations/qbittorrent
# 5.2.4) in one Pod/controller so they share a network namespace: gluetun owns it, firewalls it
# (kill switch -- only the WireGuard tunnel, DNS, and the cluster's own pod/service subnets get
# through), and qBittorrent rides inside with no network settings of its own.
#
# qBittorrent stays on 5.2.x: MyAnonamouse doesn't allow 5.3.x yet (.github/renovate.json5 holds
# it back; lift that once MAM's client list accepts 5.3).
#
# AirVPN, static port forwarding: FIREWALL_VPN_INPUT_PORTS and qBittorrent's --torrenting-port
# both come from the same FORWARDED_PORT secret key, so the two always agree. FIREWALL_INPUT_PORTS
# opens the web UI on the pod interface (eth0) for kubelet probes and the Service; gluetun drops
# all other inbound traffic there.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gluetun-qbittorrent
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      qbittorrent:
        # One AirVPN key can only be connected once: never run the old and new pod together.
        strategy: Recreate
        initContainers:
          # Sign-in is the gateway's passkey check (network/lab-sso), so the web UI skips its own
          # login for the pod network only (AuthSubnetWhitelist 10.244.0.0/16: Envoy's pod IPs, and
          # the media/status/observability pods the lab-sso-ingress policy lets in). The image's
          # default bypassed every RFC1918 client, including the whole tailnet/lab; this rewrites
          # the WebUI settings on every start because qBittorrent can't take them as flags. The
          # admin login from gluetun-secret stays for anything outside that subnet. 5.2 reads them
          # from [Preferences] as WebUI\*, 5.3+ from [WebUI]: both are written, so moving between
          # versions never falls back to the image's bypass or to no password at all. (No ${...}
          # in the script: Flux postBuild substitution would rewrite it.)
          #
          # [BitTorrent] is bound to gluetun's tun0: qBittorrent starts alongside gluetun, before
          # the tunnel exists, and unbound it only ever listened on eth0/lo, so its peer and DHT
          # traffic left with the pod address, which the tunnel can't carry (0 DHT nodes, always
          # "firewalled"). Bound, it waits for tun0 and follows it across reconnects.
          harden-webui:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: "5.2.4"
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                f=/config/qBittorrent/qBittorrent.conf
                mkdir -p /config/qBittorrent
                [ -f "$f" ] || cp /defaults/qBittorrent.conf "$f"
                # ensure SECTION KEY=VALUE...: set these keys in [SECTION], adding it if missing.
                ensure() {
                  SEC=$1
                  shift
                  WANT=$(printf '%s\n' "$@")
                  export SEC WANT
                  awk '
                    BEGIN { sec = ENVIRON["SEC"]; n = split(ENVIRON["WANT"], L, "\n")
                            for (i = 1; i <= n; i++) { k = substr(L[i], 1, index(L[i], "=") - 1); v[k] = L[i]; ord[i] = k } }
                    function flush(j) { for (j = 1; j <= n; j++) if (!(ord[j] in seen)) print v[ord[j]]; flushed = 1 }
                    /^\[.*\]$/ { if (cur == sec) flush(); cur = substr($0, 2, length($0) - 2); if (cur == sec) found = 1; print; next }
                    cur == sec { k = substr($0, 1, index($0, "=") - 1); if (k in v) { print v[k]; seen[k] = 1; next } }
                    { print }
                    END { if (cur == sec && !flushed) flush()
                          if (!found) { print ""; print "[" sec "]"; for (j = 1; j <= n; j++) print v[ord[j]] } }
                  ' "$f" > "$f.new"
                  mv "$f.new" "$f"
                }
                pw="\"$QBT_WEBUI_PASSWORD_PBKDF2\""
                ensure WebUI AuthSubnetWhitelistEnabled=true AuthSubnetWhitelist=10.244.0.0/16 \
                  LocalHostAuth=true CSRFProtection=true Username=admin "Password_PBKDF2=$pw"
                ensure Preferences 'WebUI\AuthSubnetWhitelistEnabled=true' 'WebUI\AuthSubnetWhitelist=10.244.0.0/16' \
                  'WebUI\LocalHostAuth=true' 'WebUI\CSRFProtection=true' 'WebUI\Username=admin' "WebUI\\Password_PBKDF2=$pw"
                ensure BitTorrent 'Session\Interface=tun0' 'Session\InterfaceName=tun0'
                grep -E '^(WebUI\\)?(AuthSubnetWhitelist|AuthSubnetWhitelistEnabled|LocalHostAuth|CSRFProtection|Username)=|^Session\\Interface(Name)?=' "$f"
            env:
              QBT_WEBUI_PASSWORD_PBKDF2:
                valueFrom:
                  secretKeyRef:
                    name: gluetun-secret
                    key: QBT_WEBUI_PASSWORD_PBKDF2
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
        containers:
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: "v3.41.3"
            # Before every start (container restarts keep the pod's network namespace):
            # - gluetun treats any IPv6 route as working IPv6 (netlink.IsIPv6Supported); the pod's
            #   link-local fe80::/64 counts, and so do the tun0 routes a previous run left, so it
            #   picks AirVPN IPv6 endpoints the IPv4-only cluster can't reach. Flush them.
            # - A previous run's table-51820 rules make it fail with "adding IPv6 rule ... file
            #   exists" (gluetun wiki, Kubernetes: delete them on start).
            command:
              - sh
              - -c
              - >-
                ip rule del table 51820 2>/dev/null; ip -6 rule del table 51820 2>/dev/null;
                ip -6 route flush table main; ip -6 route flush table 51820 2>/dev/null;
                exec /gluetun-entrypoint
            env:
              TZ: America/Chicago
              VPN_SERVICE_PROVIDER: airvpn
              VPN_TYPE: wireguard
              SERVER_COUNTRIES: United States
              # AirVPN's NYC servers all exit through one network (AS11878, tzulo), and the
              # MyAnonamouse seedbox session is ASN-locked: a reconnect to another US city lands
              # on another network, which MAM rejects ("Invalid session - ASN mismatch").
              SERVER_CITIES: New York City
              FIREWALL_OUTBOUND_SUBNETS: 10.244.0.0/16,10.96.0.0/12
              FIREWALL_INPUT_PORTS: "8080"
              WIREGUARD_PRIVATE_KEY:
                valueFrom:
                  secretKeyRef:
                    name: gluetun-secret
                    key: WIREGUARD_PRIVATE_KEY
              WIREGUARD_PRESHARED_KEY:
                valueFrom:
                  secretKeyRef:
                    name: gluetun-secret
                    key: WIREGUARD_PRESHARED_KEY
              WIREGUARD_ADDRESSES:
                valueFrom:
                  secretKeyRef:
                    name: gluetun-secret
                    key: WIREGUARD_ADDRESSES
              FIREWALL_VPN_INPUT_PORTS:
                valueFrom:
                  secretKeyRef:
                    name: gluetun-secret
                    key: FORWARDED_PORT
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              readOnlyRootFilesystem: false
              capabilities:
                add: ["NET_ADMIN"]
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: "5.2.4"
            env:
              TZ: America/Chicago
              FORWARDED_PORT:
                valueFrom:
                  secretKeyRef:
                    name: gluetun-secret
                    key: FORWARDED_PORT
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
            args:
              - "--webui-port=8080"
              - "--torrenting-port=$(FORWARDED_PORT)"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  initialDelaySeconds: 15
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
          # MyAnonamouse upkeep, every minute:
          # - Seedbox IP: MAM only accepts announces from an IP registered to the account, and
          #   this pod's exit is AirVPN's. Whenever gluetun reports a new public IP, this calls
          #   MAM's dynamic seedbox API (changes are rate limited to one an hour, so a refused
          #   call is retried 5 minutes later). It shares the pod's network, so the call itself
          #   leaves through the tunnel, which is how MAM learns the IP. The session
          #   (MAM_SEEDBOX_ID, "allow dynamic seedbox") comes from scripts/media-secrets.py as a
          #   mounted file; the cookie MAM may rotate is kept on the config PVC.
          # - Seeding limits: every private torrent in "books" seeds 7 days with no ratio limit
          #   (MAM counts under 72h as a hit and run). Bindery sets this per torrent when it
          #   grabs, but it computes the hash from the .torrent and can call before qBittorrent
          #   has added it, which qBittorrent ignores; the torrent then stops after the global
          #   10 minutes. Same 7 days as MAM_SEED_MINUTES in bindery/app/setup.py.
          #   qBittorrent's localhost needs a login, so this goes through the pod IP, which is
          #   inside the web UI's whitelisted subnet.
          mam-upkeep:
            image:
              repository: python
              tag: 3.15-slim
            env:
              POD_IP:
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
            command: ["python3", "-u", "-c"]
            args:
              - |
                import json, os, time, urllib.parse, urllib.request

                QBT = "http://" + os.environ["POD_IP"] + ":8080/api/v2"
                MAM = "https://t.myanonamouse.net/json/dynamicSeedbox.php"
                SEED_MINUTES = 7 * 24 * 60
                STATE = "/config/mam"

                def fetch(url, headers=None, data=None, timeout=30):
                    with urllib.request.urlopen(urllib.request.Request(url, data, headers or {}), timeout=timeout) as r:
                        return r.read().decode(), r.headers.get_all("Set-Cookie") or []

                def read(name):
                    try:
                        with open(name) as f:
                            return f.read().strip()
                    except OSError:
                        return ""

                def write(name, value):
                    with open(name, "w") as f:
                        f.write(value)

                def enforce_limits():
                    torrents = json.loads(fetch(QBT + "/torrents/info?category=books")[0])
                    short = [t["hash"] for t in torrents if t.get("private")
                             and (t["ratio_limit"] != -1 or t["seeding_time_limit"] != SEED_MINUTES)]
                    if short:
                        fetch(QBT + "/torrents/setShareLimits", data=urllib.parse.urlencode({
                            "hashes": "|".join(short), "ratioLimit": -1, "seedingTimeLimit": SEED_MINUTES,
                            "inactiveSeedingTimeLimit": -2, "shareLimitAction": "Default"}).encode())
                        print(f"seeding limits set on {len(short)} torrent(s)")

                def register(ip):
                    session = read("/mam/MAM_SEEDBOX_ID")
                    if not session:
                        print("no MAM_SEEDBOX_ID yet")
                        return False
                    if read(STATE + "/source") != session or not read(STATE + "/mam_id"):
                        write(STATE + "/mam_id", session)  # a new session from the vault
                        write(STATE + "/source", session)
                    body, cookies = fetch(MAM, {"Cookie": "mam_id=" + read(STATE + "/mam_id")})
                    for c in cookies:
                        if c.startswith("mam_id="):
                            write(STATE + "/mam_id", c.split(";")[0].removeprefix("mam_id="))
                    print(time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), ip, body)
                    return json.loads(body).get("Success") is True

                os.makedirs(STATE, exist_ok=True)
                last_ip, next_try = "", 0.0
                while True:
                    try:
                        enforce_limits()
                    except Exception as e:
                        print("qBittorrent:", e)
                    try:
                        ip = json.loads(fetch("http://127.0.0.1:8000/v1/publicip/ip", timeout=10)[0]).get("public_ip", "")
                        if ip and ip != last_ip and time.time() >= next_try:
                            if register(ip):
                                last_ip = ip
                            else:
                                next_try = time.time() + 300
                    except Exception as e:
                        print("MAM:", e)
                        next_try = time.time() + 300
                    time.sleep(60)
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      # The pod resolves through gluetun (127.0.0.1). For <name>.int.z7x.org it answers NOERROR
      # with no records instead of NXDOMAIN, and musl (qBittorrent's image) stops searching at the
      # first NOERROR, so with the default ndots:5 every tracker/DHT lookup walked the search list
      # into that and failed ("bad address"). ndots:1 looks dotted names up as written first.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
    service:
      app:
        controller: qbittorrent
        ports:
          http:
            port: *port
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: proxmox-vmdata
        accessMode: ReadWriteOnce
        size: 2Gi
        advancedMounts:
          qbittorrent:
            harden-webui:
              - path: /config
            app:
              - path: /config
            mam-upkeep:
              - path: /config
      mam-session:
        type: secret
        name: gluetun-secret
        items:
          - key: MAM_SEEDBOX_ID
            path: MAM_SEEDBOX_ID
        advancedMounts:
          qbittorrent:
            mam-upkeep:
              - path: /mam
                readOnly: true
      media:
        type: nfs
        server: "${MEDIA_NFS_SERVER}"
        path: "${MEDIA_NFS_PATH}"
        advancedMounts:
          qbittorrent:
            app:
              - path: /media
    route:
      app:
        hostnames: ["qbittorrent.z7x.org"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
