# Wizarr: invite links for Jellyfin. Someone opens invite.z7x.org/j/<code>, picks a username and
# password, Wizarr creates the Jellyfin account, then walks them through the apps and Seerr.
# Its own admin login is off (DISABLE_BUILTIN_AUTH): the admin UI is only routed on the internal
# gateway behind Pocket ID (httproute.yaml, lab-sso), and CiliumNetworkPolicy lab-sso-ingress
# keeps anything else off the pod.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wizarr
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      wizarr:
        containers:
          app:
            image:
              repository: ghcr.io/wizarrrr/wizarr
              tag: "v2026.10.1"
            env:
              TZ: America/Chicago
              DISABLE_BUILTIN_AUTH: "true"
              # Started as uid 1000 (not root), the entrypoint skips its chown of the root-owned
              # /.cache, so uv must not try to cache there.
              UV_NO_CACHE: "1"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 5690
                  initialDelaySeconds: 30
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 15
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 768Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: wizarr
        ports:
          http:
            port: *port
    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: proxmox-vmdata
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /data
