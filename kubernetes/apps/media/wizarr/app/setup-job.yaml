# Gives Wizarr its two media servers -- Jellyfin (HomeNet: Movies/Shows/Music/Anime/Anime Movies,
# Playlists off) and Audiobookshelf (HomeNet Books: Audiobooks/Ebooks, downloads on) -- and the
# "Automatic requests"/"Discord community" post-invite wizard steps (setup.py). DISABLE_BUILTIN_AUTH
# on the wizarr HelmRelease means this Job's own GET /login (no credentials) is enough to act as
# Wizarr's admin; ABS_ROOT_PASSWORD is only for minting Wizarr's Audiobookshelf API key when it has
# none that works. One run per change of the script (hashed ConfigMap name) or of the credentials
# (media-config/credentials-rev, bumped by scripts/media-secrets.py). Re-run by hand:
#   kubectl -n media delete job wizarr-setup && flux reconcile ks wizarr
apiVersion: batch/v1
kind: Job
metadata:
  name: wizarr-setup
  namespace: media
spec:
  backoffLimit: 10
  template:
    metadata:
      annotations:
        media-config/credentials-rev: "2026-11-04T21:33:41Z"
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          image: python:3.15-slim
          # -u: unbuffered, so `kubectl logs` shows each step as it happens.
          command: ["python3", "-u", "/script/setup.py"]
          env:
            - name: JELLYFIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jellyfin-sso
                  key: JELLYFIN_API_KEY
            - name: ABS_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: audiobookshelf
                  key: ABS_ROOT_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /script
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: wizarr-setup-script
