# Wizarr plus its setup Job (app/setup.py): Jellyfin media server + libraries, and the
# "Automatic requests"/"Discord community" post-invite wizard steps. force: true re-creates the
# (immutable) Job when its script changes, so each change runs it once. jellyfin first: the Job
# needs it reachable to scan libraries and test the connection.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wizarr
  namespace: flux-system
spec:
  targetNamespace: media
  path: ./kubernetes/apps/media/wizarr/app
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: true
  dependsOn:
    - name: media-app-template
    - name: envoy-gateway-config
    - name: jellyfin
    # setup.py adds Audiobookshelf as Wizarr's second server (its libraries must exist).
    - name: audiobookshelf
    # components/volsync: the ReplicationSource needs its CRD and controller first.
    - name: volsync
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    # APP/VOLSYNC_CAPACITY: components/volsync (nightly restic backup of the wizarr PVC to R2).
    substitute:
      APP: wizarr
      VOLSYNC_CAPACITY: 1Gi
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: wizarr
      namespace: media
