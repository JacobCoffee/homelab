# flaresolverr/flaresolverr:v3.5.2, latest as of 2026-11-01. Upstream is still actively released
# (not actually archived, despite some 2026 blog posts claiming so); kept over Byparr since it's
# the better-known, larger project and is what Prowlarr documents by name. No persistence, no
# route: it's a backend-only proxy Prowlarr's indexers call internally.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flaresolverr
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      flaresolverr:
        containers:
          app:
            image:
              repository: ghcr.io/flaresolverr/flaresolverr
              tag: "v3.5.2"
            env:
              TZ: America/Chicago
              LOG_LEVEL: info
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8191
                  initialDelaySeconds: 15
                  periodSeconds: 15
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 15
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    service:
      app:
        controller: flaresolverr
        ports:
          http:
            port: *port
