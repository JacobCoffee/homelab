# Audiobookshelf at books.z7x.org: friends read and listen to what Bindery downloads. Its setup Job
# (app/setup.py) creates the admin account, the Audiobooks/Ebooks libraries and the Bindery link
# over its HTTP API. force: true re-creates the (immutable) Job when its script changes.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: audiobookshelf
  namespace: flux-system
spec:
  targetNamespace: media
  path: ./kubernetes/apps/media/audiobookshelf/app
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  force: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: media-app-template
    - name: envoy-gateway-config
    - name: bindery
    # components/volsync: the ReplicationSource needs its CRD and controller first.
    - name: volsync
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    # APP/VOLSYNC_CAPACITY: components/volsync (nightly restic backup of the audiobookshelf PVC).
    substitute:
      APP: audiobookshelf
      VOLSYNC_CAPACITY: 2Gi
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: audiobookshelf
      namespace: media
