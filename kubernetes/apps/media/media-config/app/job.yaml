# One run per change of configure.py (hashed ConfigMap name) or of the credentials
# (media-config/credentials-rev, bumped by scripts/media-secrets.py). Re-run by hand:
#   kubectl -n media delete job media-config && flux reconcile ks media-config
apiVersion: batch/v1
kind: Job
metadata:
  name: media-config
  namespace: media
spec:
  backoffLimit: 10
  template:
    metadata:
      annotations:
        media-config/credentials-rev: "2026-11-03T04:55:09Z"
    spec:
      restartPolicy: OnFailure
      # uid/gid 1000, matching the *arrs and the rest of the /media NFS tree: configure.py
      # creates the new anime library directories there (ensure_library_dirs()).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure
          image: python:3.15-slim
          # -u: unbuffered, so `kubectl logs` shows each step as it happens.
          command: ["python3", "-u", "/script/configure.py"]
          envFrom:
            - secretRef:
                name: arr-api-keys
            - secretRef:
                name: media-config
          env:
            # Jellyfin admin key (scripts/jellyfin-sso-key.py), for the *arrs' library-refresh hook.
            - name: JELLYFIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jellyfin-sso
                  key: JELLYFIN_API_KEY
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /script
              readOnly: true
            - name: media
              mountPath: /media
      volumes:
        - name: script
          configMap:
            name: media-config-script
        # This plain Job manifest has no Flux postBuild substitution (unlike the *arrs'
        # HelmReleases), so server/path are literal here -- keep in sync with
        # MEDIA_NFS_SERVER/MEDIA_NFS_PATH in flux/cluster/cluster-settings.yaml.
        - name: media
          nfs:
            server: "10.10.30.20"
            path: "/srv/media"
