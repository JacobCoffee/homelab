# One run per change of configure.py (hashed ConfigMap name) or of the credentials
# (media-config/credentials-rev, bumped by scripts/media-config-secrets.py). Re-run by hand:
#   kubectl -n media delete job media-config && flux reconcile ks media-config
apiVersion: batch/v1
kind: Job
metadata:
  name: media-config
  namespace: media
spec:
  backoffLimit: 10
  template:
    metadata:
      annotations:
        media-config/credentials-rev: "2026-11-03T04:26:22Z"
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure
          image: python:3.15-slim
          # -u: unbuffered, so `kubectl logs` shows each step as it happens.
          command: ["python3", "-u", "/script/configure.py"]
          envFrom:
            - secretRef:
                name: arr-api-keys
            - secretRef:
                name: media-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /script
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: media-config-script
