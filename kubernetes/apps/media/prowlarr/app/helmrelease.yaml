# Latest ghcr.io/home-operations/prowlarr tag as of 2026-11-01. PROWLARR_API_KEY from
# arr-api-keys. No /media mount: Prowlarr only manages indexers, it never touches files.
# Adding Sonarr/Radarr/Lidarr as "Apps" inside Prowlarr is a manual UI step (see README) --
# there is no supported env/file based way to pre-wire that linkage.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      prowlarr:
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/prowlarr
              tag: "2.1.5.5216"
            env:
              TZ: America/Chicago
              PROWLARR__AUTH__METHOD: Forms
              # Enabled, not DisabledForLocalAddresses: every request arrives from the gateway's
              # pod IP, which counts as local, so that setting meant no login at all.
              PROWLARR__AUTH__REQUIRED: Enabled
              PROWLARR__AUTH__APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: arr-api-keys
                    key: PROWLARR_API_KEY
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: &port 9696
                  initialDelaySeconds: 10
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: prowlarr
        ports:
          http:
            port: *port
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: proxmox-vmdata
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /config
    route:
      app:
        hostnames: ["prowlarr.z7x.org"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
