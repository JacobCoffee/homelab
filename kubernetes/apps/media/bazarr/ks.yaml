# Bazarr plus its setup Job (app/setup.py): Sonarr/Radarr connections, an "English" language
# profile applied to every series and movie, and subtitle providers (OpenSubtitles.com plus three
# account-free ones). force: true re-creates the (immutable) Job when its script or the
# media-config/credentials-rev annotation changes, so each change runs it once.

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bazarr
  namespace: flux-system
spec:
  targetNamespace: media
  path: ./kubernetes/apps/media/bazarr/app
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  force: true
  dependsOn:
    - name: media-app-template
    - name: envoy-gateway-config
    - name: arr-api-keys
    - name: sonarr
    - name: radarr
    - name: jellyfin
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: bazarr
      namespace: media
