# Removes stalled/blocked/malicious downloads from qBittorrent and SABnzbd and nudges
# Sonarr/Radarr/Lidarr to re-search, replacing the unmaintained Decluttarr. Connections to the
# arrs and the download clients, and the Queue Cleaner/Malware Blocker/Download Cleaner rules,
# are set by its own setup Job (app/setup.py). force: true re-creates the (immutable) Job when
# its script changes, so each change runs it once.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cleanuparr
  namespace: flux-system
spec:
  targetNamespace: media
  path: ./kubernetes/apps/media/cleanuparr/app
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  force: true
  dependsOn:
    - name: media-app-template
    - name: envoy-gateway-config
    - name: arr-api-keys
    - name: sonarr
    - name: radarr
    - name: lidarr
    - name: gluetun-qbittorrent
    - name: sabnzbd
    - name: media-config
    # components/volsync: the ReplicationSource needs its CRD and controller first.
    - name: volsync
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cleanuparr
      namespace: media
  postBuild:
    # APP/VOLSYNC_CAPACITY: components/volsync (nightly restic backup of the cleanuparr PVC to R2).
    substitute:
      APP: cleanuparr
      VOLSYNC_CAPACITY: 1Gi
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
