# Removes stalled/blocked/malicious downloads from qBittorrent and nudges Sonarr/Radarr/Lidarr
# to re-search, replacing the unmaintained Decluttarr. Connections to the arrs and qBittorrent
# are configured in its own UI (no declarative env-based config in the actively maintained fork).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cleanuparr
  namespace: flux-system
spec:
  targetNamespace: media
  path: ./kubernetes/apps/media/cleanuparr/app
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: media-app-template
    - name: envoy-gateway-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cleanuparr
      namespace: media
