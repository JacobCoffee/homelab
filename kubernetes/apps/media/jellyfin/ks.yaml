apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin
  namespace: flux-system
spec:
  targetNamespace: media
  path: ./kubernetes/apps/media/jellyfin/app
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: true
  dependsOn:
    - name: media-app-template
    - name: envoy-gateway-config
    # components/volsync: the ReplicationSource needs its CRD and controller first.
    - name: volsync
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    # APP/VOLSYNC_CAPACITY: components/volsync (nightly restic backup of the jellyfin PVC to R2).
    substitute:
      APP: jellyfin
      VOLSYNC_CAPACITY: 1Gi
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: jellyfin
      namespace: media
