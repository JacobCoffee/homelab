apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
  - ./helmrelease.yaml
  - ./secret.sops.yaml
  - ./plugins-secret.sops.yaml
  - ./sso-install-job.yaml
  - ./plugins-job.yaml
configMapGenerator:
  - name: jellyfin-sso-install-script
    files:
      - ./install-sso.py
      - ./jellyfin_api.py
  - name: jellyfin-plugins-script
    files:
      - ./plugins.py
      - ./jellyfin_api.py
  # The splash and logo plugins.py sets (branding/build.py makes them). Hashed name: a new image
  # changes the Job's pod template, so Flux re-runs it.
  - name: jellyfin-branding
    files:
      - ./branding/splash.jpg
      - ./branding/logo.svg
