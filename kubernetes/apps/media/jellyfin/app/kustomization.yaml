apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
  - ./helmrelease.yaml
  - ./secret.sops.yaml
  - ./plugins-secret.sops.yaml
  - ./sso-install-job.yaml
  - ./plugins-job.yaml
configMapGenerator:
  - name: jellyfin-sso-install-script
    files:
      - ./install-sso.py
      - ./jellyfin_api.py
  - name: jellyfin-plugins-script
    files:
      - ./plugins.py
      - ./jellyfin_api.py
