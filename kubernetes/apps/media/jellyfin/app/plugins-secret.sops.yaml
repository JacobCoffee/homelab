# opensubtitles.com login for the Open Subtitles plugin (jellyfin-plugins Job, plugins.py).
# Values come from the Ansible vault -- don't edit here, run:
#   scripts/vault-set.py vault_opensubtitles_username vault_opensubtitles_password
#   scripts/media-secrets.py   # copies them in here and bumps the Job's credentials-rev
# Empty values make plugins.py skip the login.
#
# SEERR_API_KEY (Jellyfin Enhanced's Seerr integration) is NOT vault-managed: Seerr has no
# config-as-code, so this is copied by hand from Seerr's own settings.json (main.apiKey, read via
# `kubectl -n media exec deploy/seerr -- cat /app/config/settings.json`) with:
#   scripts/vault-set.py vault_seerr_api_key   # optional, for a vault copy
#   mise exec -- sops set --value-stdin kubernetes/apps/media/jellyfin/app/plugins-secret.sops.yaml '["stringData"]["SEERR_API_KEY"]'
# then bump plugins-job.yaml's media-config/credentials-rev by hand to this file's new
# sops.lastmodified (media-secrets.py doesn't manage this key).
