# docker.io/jellyfin/jellyfin:12.4.20261026-211555, latest 12.4.x build as of 2026-11-01.
# CPU-only transcoding (no GPU in the Talos VMs): resources sized to not starve a 4 vCPU node
# under a transcode burst. Admin account creation is a manual first-run step (see README).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      jellyfin:
        containers:
          app:
            image:
              repository: docker.io/jellyfin/jellyfin
              tag: "12.4.20261026-211555"
            env:
              TZ: America/Chicago
              JELLYFIN_PublishedServerUrl: https://media.z7x.org
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8096
                  initialDelaySeconds: 30
                  periodSeconds: 15
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 15
            # The memory request is what it actually holds with the plugins and the live TV
            # guide loaded (~2Gi). At 512Mi the scheduler packed it onto hnk8s03 (8GB, also
            # cabotage's stack) next to Dispatcharr, which ran the node out of memory.
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                cpu: "3"
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: jellyfin
        ports:
          http:
            port: *port
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: proxmox-vmdata
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /config
      media:
        type: nfs
        server: "${MEDIA_NFS_SERVER}"
        path: "${MEDIA_NFS_PATH}"
        globalMounts:
          - path: /media
      transcode:
        type: emptyDir
        globalMounts:
          - path: /config/transcodes
    route:
      external:
        hostnames: ["media.z7x.org"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      internal:
        hostnames: ["media.z7x.org"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
