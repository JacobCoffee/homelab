# Lets the Job restart Jellyfin (and nothing else) after installing the plugin: plugins only load
# at process start, and Jellyfin's own /System/Restart leaves the container running.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jellyfin-sso-install
  namespace: media
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jellyfin-sso-install
  namespace: media
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["jellyfin"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jellyfin-sso-install
  namespace: media
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jellyfin-sso-install
subjects:
  - kind: ServiceAccount
    name: jellyfin-sso-install
    namespace: media
---
apiVersion: batch/v1
kind: Job
metadata:
  name: jellyfin-sso-install
  namespace: media
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: jellyfin-sso-install
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: install-sso
          image: python:3.15-slim
          # -u: unbuffered, so `kubectl logs` shows each step as it happens.
          command: ["python3", "-u", "/script/install-sso.py"]
          envFrom:
            - secretRef:
                name: jellyfin-sso
          env:
            - name: JELLYFIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jellyfin-sso
                  key: JELLYFIN_API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /script
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: jellyfin-sso-install-script
