apiVersion: batch/v1
kind: Job
metadata:
  name: jellyfin-sso-install
  namespace: media
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: install-sso
          image: python:3.12-slim
          command: ["python3", "/script/install-sso.py"]
          envFrom:
            - secretRef:
                name: jellyfin-sso
          env:
            - name: JELLYFIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jellyfin-sso
                  key: JELLYFIN_API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /script
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: jellyfin-sso-install-script
