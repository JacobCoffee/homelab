<!doctype html>
<!--
  Jellyfin splash screen: the view from the projection booth. One WebGL2 fragment shader, drawn
  once (no animation: Jellyfin shows the result as a still backdrop). build.py opens this page
  headless and saves the canvas; open it in a browser to look at it, ?w=&h= to change the size.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>HomeNet splash</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070c; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform vec2 res;
out vec4 outColor;

// ---------- noise ----------
float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
vec2 hash22(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.xx + p3.yz) * p3.zy);
}
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1, 0)), u.x),
             mix(hash12(i + vec2(0, 1)), hash12(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) {
  float s = 0.0, a = 0.5;
  mat2 r = mat2(0.8, -0.6, 0.6, 0.8);
  for (int i = 0; i < 6; i++) { s += a * vnoise(p); p = r * p * 2.03 + 11.7; a *= 0.5; }
  return s;
}

// ---------- the room ----------
// Frame: x in [0, aspect], y in [0, 1], y up.
const vec3 TUNGSTEN = vec3(1.00, 0.74, 0.42);
const vec3 HOT      = vec3(1.00, 0.93, 0.80);
const vec3 NIGHT    = vec3(0.008, 0.011, 0.022);
const vec3 BLUE     = vec3(0.06, 0.10, 0.20);

// Screen at the far end, right of centre; the beam's port just off the top-left corner.
vec2 SCR_C;  vec2 SCR_H;  vec2 PORT;

float screenMask(vec2 p, float soft) {
  vec2 d = abs(p - SCR_C) - SCR_H;
  float e = length(max(d, 0.0)) + min(max(d.x, d.y), 0.0);
  return 1.0 - smoothstep(-soft, soft, e);
}

// What's on the screen: a film frame seen from the back of the house, soft and out of focus:
// dusk sky from teal to amber, a low sun, a dark horizon. Colour without a readable picture.
vec3 screenLight(vec2 p) {
  vec2 q = (p - SCR_C) / SCR_H;
  vec3 sky = mix(vec3(0.30, 0.62, 0.72), vec3(1.00, 0.62, 0.30), smoothstep(0.7, -0.35, q.y));
  float sun = exp(-pow(length((q - vec2(0.38, -0.18)) * vec2(1.0, 1.6)) / 0.35, 2.0));
  vec3 col = sky * 0.85 + vec3(1.0, 0.85, 0.6) * sun * 0.6;
  float land = smoothstep(-0.40, -0.55, q.y + 0.05 * sin(q.x * 3.0 + 1.0));
  col = mix(col, vec3(0.06, 0.07, 0.10), land * 0.85);
  float fall = 1.0 - 0.25 * dot(q * vec2(0.8, 1.0), q * vec2(0.8, 1.0));
  return col * fall;
}

// The beam: the cone between the port and the screen's four edges, density from drifting haze,
// with the rays the film's frame throws (angular streaks from the port). A point is in the cone
// when the line from the port through it meets the screen rectangle; `along` is how far out.
float beam(vec2 p, out float along) {
  vec2 rel = p - PORT;
  vec2 lo = SCR_C - SCR_H - PORT, hi = SCR_C + SCR_H - PORT;
  // the scale s with PORT + rel / s inside the rectangle, per axis
  vec2 a = rel / lo, b = rel / hi;
  vec2 smin = min(a, b), smax = max(a, b);
  float s0 = max(smin.x, smin.y), s1 = min(smax.x, smax.y);
  float s = 0.5 * (s0 + s1);
  along = s;
  float overlap = (s1 - s0) / max(s, 1e-4);
  float inside = smoothstep(0.0, 0.05, overlap);
  float core = smoothstep(0.04, 0.28, overlap);
  float ends = smoothstep(0.0, 0.05, s) * (1.0 - smoothstep(0.985, 1.0, s));
  float ang = atan(rel.y, rel.x);
  float rays = 0.80 + 0.20 * vnoise(vec2(ang * 45.0, 3.1)) + 0.06 * vnoise(vec2(ang * 220.0, 9.0));
  return (inside * 0.75 + core * 0.35) * ends * rays;
}

// Haze: domain-warped fbm, stretched along the beam so it reads as drifting smoke.
float haze(vec2 p) {
  vec2 q = vec2(fbm(p * 2.2 + vec2(0.0, 1.3)), fbm(p * 2.2 + vec2(5.2, 1.7)));
  float h = fbm(p * vec2(3.0, 5.0) + 2.5 * q);
  return smoothstep(0.25, 0.85, h);
}

// Seat rows: silhouettes of seat backs, rows receding towards the screen in perspective, split by
// an aisle that runs towards the screen. rowTop/aisleX are shared with the aisle's step lights.
const int ROWS = 10;
float rowScale(float k) { return 1.0 / (1.0 + k * 0.75); }
float rowTop(float k) { return SCR_C.y - SCR_H.y - 0.05 - 0.32 * rowScale(k); }
float aisleX(float k, float aspect) {
  float vanish = SCR_C.x - SCR_H.x * 0.45;
  return vanish + (aspect * 0.30 - vanish) * rowScale(k);
}

// Returns 1 inside a silhouette; rim = light the screen puts on the tops of the backs.
float seats(vec2 p, float aspect, out float rim) {
  rim = 0.0;
  float hit = 0.0;
  for (int k = 0; k < ROWS; k++) {
    float fk = float(k);
    float scale = rowScale(fk);
    float seatW = 0.12 * scale;
    // rows curve gently around the screen
    float curve = 0.25 * scale * pow((p.x - SCR_C.x) / aspect, 2.0);
    float x = (p.x + fk * 0.37) / seatW;
    float cell = fract(x) - 0.5;
    float id = floor(x);
    float jitter = (hash12(vec2(id, fk)) - 0.5) * 0.004 * scale;
    // one seat back: a rounded top with a narrow gap between seats
    float shoulder = sqrt(max(0.0, 1.0 - pow(abs(cell) / 0.46, 6.0)));
    float edge = rowTop(fk) + curve + jitter + 0.035 * scale * (shoulder - 1.0);
    float gap = step(0.46, abs(cell));
    float inRow = step(p.y, edge) * (1.0 - gap * step(edge - 0.022 * scale, p.y));
    // the aisle: rows break where the steps run down
    inRow *= step(0.030 * scale, abs(p.x - aisleX(fk, aspect)));
    if (inRow > 0.5 && hit < 0.5) {
      hit = 1.0;
      float d = edge - p.y;
      rim = exp(-d / (0.0030 * scale + 0.0006)) * (0.6 + 0.4 * shoulder);
    }
  }
  return hit;
}

vec3 render(vec2 frag) {
  float aspect = res.x / res.y;
  vec2 p = vec2(frag.x / res.y, frag.y / res.y);

  SCR_C = vec2(aspect * 0.68, 0.585);
  SCR_H = vec2(aspect * 0.115, 0.066);
  PORT  = vec2(-0.04, 1.05);

  // room: blue-black, a touch lighter towards the lit screen
  float toScreen = length((p - SCR_C) * vec2(0.55, 1.0));
  vec3 col = NIGHT + BLUE * 0.10 * exp(-toScreen * 3.2);
  // side walls catch a little spill
  col += BLUE * 0.015 * smoothstep(0.35, 0.0, abs(p.y - SCR_C.y)) * smoothstep(0.2, 1.4, abs(p.x - SCR_C.x));

  // screen and its bloom, coloured by the picture
  float sm = screenMask(p, 0.0016);
  col = mix(col, screenLight(p), sm);
  float bloom = exp(-max(length(max(abs(p - SCR_C) - SCR_H, 0.0)), 0.0) * 16.0);
  col += mix(vec3(1.0, 0.70, 0.45), vec3(0.45, 0.70, 0.80), smoothstep(SCR_C.y - 0.2, SCR_C.y + 0.2, p.y)) * 0.10 * bloom * (1.0 - sm);
  // the projector port: the lens's glow just off the top-left corner
  col += HOT * 0.55 * exp(-length(p - PORT) * 9.0);

  // the beam through the haze
  float along;
  float b = beam(p, along);
  float h = haze(p + vec2(along * 0.15, 0.0));
  float density = b * (0.12 + 1.45 * h * h);
  vec3 beamCol = mix(HOT, TUNGSTEN, smoothstep(0.0, 0.9, along));
  float falloff = mix(1.30, 0.45, clamp(along, 0.0, 1.0));
  // in front of the screen the beam is only haze; the picture stays clean
  col += beamCol * density * 0.30 * falloff * (1.0 - 0.85 * sm);
  // haze outside the beam, faintly lit by the room
  col += BLUE * 0.03 * h * (1.0 - b);

  // dust motes: tiny lit specks inside the beam; a few large out-of-focus ones near the port
  for (int layer = 0; layer < 3; layer++) {
    float fl = float(layer);
    float cellSize = mix(0.012, 0.050, fl / 2.0);
    vec2 g = p / cellSize;
    vec2 id = floor(g);
    vec2 o = 0.2 + 0.6 * hash22(id + fl * 17.0);
    vec2 c = (id + o) * cellSize;
    float alive = step(0.88 - fl * 0.03, hash12(id * 1.7 + fl));
    float r = mix(0.0006, 0.0075, fl / 2.0) * (0.6 + 0.8 * hash12(id + 3.3));
    float d = length(p - c);
    float speck = layer == 2
      ? smoothstep(r, r * 0.55, d) * 0.22 * (0.8 + 0.2 * smoothstep(r * 0.55, r * 0.85, d))
      : exp(-pow(d / r, 2.0)) * 0.7;
    float along2;
    float inBeam = beam(c, along2);
    float near = layer == 2 ? smoothstep(0.55, 0.15, along2) : 1.0;
    col += beamCol * speck * alive * inBeam * near * (1.0 - sm);
  }

  // seat rows in front of everything; tops rim-lit by the screen
  float rim;
  float s = seats(p, aspect, rim);
  vec3 seatCol = vec3(0.010, 0.012, 0.020);
  float screenSide = smoothstep(0.0, 1.0, 1.0 - abs(p.x - SCR_C.x) / aspect);
  vec3 rimCol = mix(vec3(0.55, 0.65, 0.85), TUNGSTEN, 0.35) * 0.30 * screenSide;
  col = mix(col, seatCol + rimCol * rim, s);

  // aisle step lights: one small amber light at each row's end, down the aisle
  for (int k = 0; k < ROWS; k++) {
    float fk = float(k);
    float scale = rowScale(fk);
    vec2 lp = vec2(aisleX(fk, aspect) - 0.026 * scale, rowTop(fk) - 0.060 * scale);
    float d = length((p - lp) * vec2(1.0, 1.8));
    float rr = 0.0040 * scale + 0.0006;
    col += vec3(1.0, 0.55, 0.20) * (exp(-pow(d / rr, 2.0)) * 0.8 + exp(-d / (rr * 7.0)) * 0.08);
  }

  // halation: film's red glow around the brightest light
  float hot = smoothstep(0.55, 1.2, max(col.r, max(col.g, col.b)));
  col += vec3(0.20, 0.04, 0.0) * hot * 0.5;

  // vignette, a 35mm lens's
  vec2 v = (frag / res) - 0.5;
  col *= 1.0 - 0.75 * pow(length(v * vec2(1.05, 1.25)), 2.4);
  return col;
}

vec3 tonemap(vec3 c) {
  // filmic: lifted blacks stay deep, highlights roll off like print stock
  c = max(c, 0.0);
  vec3 x = c * 1.15;
  vec3 m = (x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14);
  return pow(clamp(m, 0.0, 1.0), vec3(1.0 / 2.2));
}

void main() {
  // 4 rotated-grid samples per pixel: clean seat edges and specks at any size
  vec2 off[4] = vec2[](vec2(0.125, 0.375), vec2(0.375, -0.125), vec2(-0.125, -0.375), vec2(-0.375, 0.125));
  vec3 c = vec3(0.0);
  for (int i = 0; i < 4; i++) c += render(gl_FragCoord.xy + off[i]);
  c = tonemap(c * 0.25);
  // 35mm grain, stronger in the shadows like film
  float g = hash12(gl_FragCoord.xy * 0.73 + 19.0) + hash12(gl_FragCoord.xy * 1.37 + 7.0) - 1.0;
  float lum = dot(c, vec3(0.299, 0.587, 0.114));
  c += g * mix(0.030, 0.012, lum);
  outColor = vec4(c, 1.0);
}
</script>
<script>
  const params = new URLSearchParams(location.search);
  const W = +params.get("w") || 2560, H = +params.get("h") || 1440;
  const canvas = document.getElementById("c");
  canvas.width = W; canvas.height = H;
  const gl = canvas.getContext("webgl2", { preserveDrawingBuffer: true, antialias: false });
  const vs = `#version 300 es
in vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }`;
  function shader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, shader(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, document.getElementById("fs").textContent));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.uniform2f(gl.getUniformLocation(prog, "res"), W, H);
  gl.viewport(0, 0, W, H);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.finish();
  window.splashDone = true;
</script>
</body>
</html>
