# Bindery plus its setup Job (app/setup.py): ebook + audiobook root folders, SABnzbd/qBittorrent
# download clients, and a Prowlarr indexer sync. force: true re-creates the (immutable) Job when
# its script changes, so each change runs it once.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bindery
  namespace: flux-system
spec:
  targetNamespace: media
  path: ./kubernetes/apps/media/bindery/app
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  force: true
  dependsOn:
    - name: media-app-template
    - name: envoy-gateway-config
    - name: arr-api-keys
    - name: sabnzbd
    - name: prowlarr
    - name: gluetun-qbittorrent
    - name: media-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: bindery
      namespace: media
