# No VPN: Usenet traffic goes straight out (SSL to the provider), unlike BitTorrent.
# Usenet provider/indexer accounts are entered in SABnzbd's own UI -- nothing account-specific
# belongs in git.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sabnzbd
  namespace: flux-system
spec:
  targetNamespace: media
  path: ./kubernetes/apps/media/sabnzbd/app
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: media-app-template
    - name: envoy-gateway-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: sabnzbd
      namespace: media
