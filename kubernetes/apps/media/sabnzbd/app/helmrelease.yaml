# ghcr.io/home-operations/sabnzbd:5.1.3, latest as of 2026-11-01. The image's entrypoint writes
# SABNZBD__API_KEY and SABNZBD__HOST_WHITELIST_ENTRIES into sabnzbd.ini on every start: the key
# (SABNZBD_API_KEY in arr-api-keys, the one SABnzbd generated on first boot) is what Homepage and
# the *arrs use; the whitelist lets the gateway name and in-cluster Service names through
# SABnzbd's hostname check (anything else gets "Access denied - Hostname verification failed").
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      sabnzbd:
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sabnzbd
              tag: "5.1.3"
            env:
              TZ: America/Chicago
              SABNZBD__HOST_WHITELIST_ENTRIES: sabnzbd.z7x.org, sabnzbd.media.svc.cluster.local, sabnzbd.media.svc, sabnzbd.media
              SABNZBD__API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: arr-api-keys
                    key: SABNZBD_API_KEY
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  initialDelaySeconds: 10
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: sabnzbd
        ports:
          http:
            port: *port
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: proxmox-vmdata
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /config
      media:
        type: nfs
        server: "${MEDIA_NFS_SERVER}"
        path: "${MEDIA_NFS_PATH}"
        globalMounts:
          - path: /media
    route:
      app:
        hostnames: ["sabnzbd.z7x.org"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
