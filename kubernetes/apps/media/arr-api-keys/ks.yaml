# Shared arr-api-keys Secret, consumed by sonarr/radarr/lidarr/prowlarr/sabnzbd (self auth key)
# and by recyclarr/unpackerr/homepage (to talk to those apps' APIs) -- see secret.sops.yaml.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: arr-api-keys
  namespace: flux-system
spec:
  targetNamespace: media
  path: ./kubernetes/apps/media/arr-api-keys/app
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
