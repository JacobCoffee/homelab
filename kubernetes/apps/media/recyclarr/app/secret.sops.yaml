# The whole recyclarr.yml is a Secret (not a ConfigMap) because it embeds the same API keys as
# kubernetes/apps/media/arr-api-keys/app/secret.sops.yaml. Guide-backed quality profiles (one
# trash_id each) pull in every mandatory custom format for that profile automatically -- see
# https://recyclarr.dev/guide/guide-configs/. 2160p first, 1080p only when no 2160p release
# exists: Sonarr uses WEB-2160p (Combined) as the guide ships it; Radarr uses UHD Bluray + WEB
# with a `qualities` override adding Bluray/WEB 1080p below the 2160p ones, plus the HD Bluray
# tiers and x265 (HD) scores for that fallback. Naming is TRaSH's Jellyfin (tvdb/tmdb) scheme.
