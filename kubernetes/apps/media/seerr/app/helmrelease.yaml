# ghcr.io/seerr-team/seerr:v3.5.1, latest as of 2026-11-01 (the project formerly known as
# Jellyseerr). Its Jellyfin/Sonarr/Radarr connections and library/override-rule config are set up
# by its setup Job (../setup.py) over the HTTP API -- the Jellyfin side still needs a human to sign
# in once through Seerr's own login page, since Jellyfin's own first run has no API either.
# API_KEY pins Seerr's own API key (server/lib/settings/index.ts, generateApiKey()) to the same
# value Jellyfin Enhanced's Seerr integration and the setup Job above already use (jellyfin-plugins
# Secret's SEERR_API_KEY -- see the comment in jellyfin/app/plugins-secret.sops.yaml), instead of
# letting Seerr generate and keep its own random one.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      seerr:
        containers:
          app:
            image:
              repository: ghcr.io/seerr-team/seerr
              tag: "v3.5.1"
            env:
              TZ: America/Chicago
              LOG_LEVEL: info
              API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: jellyfin-plugins
                    key: SEERR_API_KEY
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: &port 5055
                  initialDelaySeconds: 15
                  periodSeconds: 15
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 15
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: seerr
        ports:
          http:
            port: *port
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: proxmox-vmdata
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /app/config
    route:
      external:
        hostnames: ["requests.z7x.org"]
        parentRefs:
          - name: external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      internal:
        hostnames: ["requests.z7x.org"]
        parentRefs:
          - name: internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
