# Jellyseerr was renamed/relaunched upstream as "Seerr" (seerr-team/seerr); same request-manager
# UI for Jellyfin/Sonarr/Radarr. Its setup Job (app/setup.py) wires up the Jellyfin/Radarr/Sonarr
# connections, library sync and anime override rule over Seerr's own HTTP API. force: true
# re-creates the (immutable) Job when its script changes, so each change runs it once.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seerr
  namespace: flux-system
spec:
  targetNamespace: media
  path: ./kubernetes/apps/media/seerr/app
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  force: true
  dependsOn:
    - name: media-app-template
    - name: envoy-gateway-config
    - name: arr-api-keys
    - name: jellyfin
    - name: radarr
    - name: sonarr
    # components/volsync: the ReplicationSource needs its CRD and controller first.
    - name: volsync
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    # APP/VOLSYNC_CAPACITY: components/volsync (nightly restic backup of the seerr PVC to R2).
    substitute:
      APP: seerr
      VOLSYNC_CAPACITY: 1Gi
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: seerr
      namespace: media
