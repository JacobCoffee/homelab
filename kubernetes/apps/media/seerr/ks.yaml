# Jellyseerr was renamed/relaunched upstream as "Seerr" (seerr-team/seerr); same request-manager
# UI for Jellyfin/Sonarr/Radarr.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seerr
  namespace: flux-system
spec:
  targetNamespace: media
  path: ./kubernetes/apps/media/seerr/app
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: media-app-template
    - name: envoy-gateway-config
    # components/volsync: the ReplicationSource needs its CRD and controller first.
    - name: volsync
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    # APP/VOLSYNC_CAPACITY: components/volsync (nightly restic backup of the seerr PVC to R2).
    substitute:
      APP: seerr
      VOLSYNC_CAPACITY: 1Gi
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: seerr
      namespace: media
