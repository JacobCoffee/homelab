# Jellyball plus its setup Job (app/setup.py: registers its tuner and guide in Jellyfin).
# force: true re-creates the (immutable) Job when its script changes, so each change runs it once.
# jellyfin first: the Job registers the tuner there.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyball
  namespace: flux-system
spec:
  targetNamespace: media
  path: ./kubernetes/apps/media/jellyball/app
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  force: true
  dependsOn:
    - name: media-app-template
    - name: envoy-gateway-config
    - name: jellyfin
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: jellyball
      namespace: media
