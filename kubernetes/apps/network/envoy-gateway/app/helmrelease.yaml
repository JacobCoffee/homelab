# crds.enabled (chart default) installs both the Envoy Gateway CRDs and the upstream Gateway API CRDs,
# so no separate Gateway API CRD install is needed.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    config:
      envoyGateway:
        extensionApis:
          # Lua EnvoyExtensionPolicies are off by default; while off, a Lua policy is rejected and
          # the routes it targets answer 500. auth/pocket-id's theme injection needs it.
          enableLua: true
