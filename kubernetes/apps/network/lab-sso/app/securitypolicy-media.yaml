apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: lab-sso
  namespace: media
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: sonarr
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: radarr
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: lidarr
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: prowlarr
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: bazarr
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: sabnzbd
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: bindery
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: cleanuparr
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gluetun-qbittorrent
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: unpackerr
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: wizarr-internal
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: jellyball
  oidc:
    provider:
      issuer: https://id.z7x.org
    clientID: lab-gateway
    clientSecret:
      name: lab-sso-oidc
    scopes: [openid, profile, email, groups]
    # Envoy's default redirect is <scheme>://<host>/oauth2/callback on each app's own host, which
    # the lab-gateway client allows as https://*.z7x.org/oauth2/callback.
    logoutPath: /oauth2/logout
    refreshToken: true
    # Only page loads go to the sign-in. A page's background requests (fetch/XHR, websockets) get
    # a 401 instead: each redirect starts a sign-in flow with its own nonce/verifier cookies, and
    # an open start page polling dozens of widget APIs piled up >100 cookies, which Envoy rejects
    # (http2.too_many_headers), resetting every request to that host.
    denyRedirect:
      headers:
        - name: Sec-Fetch-Mode
          type: RegularExpression
          value: "^(cors|no-cors|same-origin|websocket)$"
    # Unfinished sign-in flows' cookies expire after this (default 10m).
    csrfTokenTTL: 5m
  # Pocket ID lets only lab-admins into the lab-gateway client, so any valid ID token is enough.
