# Twin of helmrelease.yaml for the second AdGuard instance (hndns02): keep both in step.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-adguard-dns02
  namespace: network
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: "1.23.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns-adguard
        namespace: network
  values:
    fullnameOverride: external-dns-adguard-dns02
    sources:
      - gateway-httproute
    extraArgs:
      gateway-name: internal
      annotation-filter: dns.z7x.org/publish notin (false)
    domainFilters:
      - z7x.org
    policy: sync
    registry: txt
    txtOwnerId: homelab
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/muhlba91/external-dns-provider-adguard
          tag: v11.2.1
        service:
          port: 8888
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          timeoutSeconds: 5
        env:
          - name: ADGUARD_URL
            value: http://10.10.10.55
          - name: ADGUARD_USER
            valueFrom:
              secretKeyRef:
                name: external-dns-adguard-credentials
                key: user
          - name: ADGUARD_PASSWORD
            valueFrom:
              secretKeyRef:
                name: external-dns-adguard-credentials
                key: password
