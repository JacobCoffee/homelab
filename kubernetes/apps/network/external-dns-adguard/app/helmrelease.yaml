# Same chart-vs-appVersion note as external-dns-cloudflare applies (1.23.0 / v0.23.0); the webhook
# sidecar image is pinned to its own latest release (v11.2.0) independently.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-adguard
  namespace: network
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: "1.23.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns-adguard
        namespace: network
  values:
    fullnameOverride: external-dns-adguard
    sources:
      - gateway-httproute
    extraArgs:
      gateway-name: internal
    policy: sync
    registry: txt
    txtOwnerId: homelab
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/muhlba91/external-dns-provider-adguard
          tag: v11.2.0
        service:
          port: 8888
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          timeoutSeconds: 5
        env:
          - name: ADGUARD_URL
            valueFrom:
              secretKeyRef:
                name: external-dns-adguard-credentials
                key: url
          - name: ADGUARD_USER
            valueFrom:
              secretKeyRef:
                name: external-dns-adguard-credentials
                key: user
          - name: ADGUARD_PASSWORD
            valueFrom:
              secretKeyRef:
                name: external-dns-adguard-credentials
                key: password
