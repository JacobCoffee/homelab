# Unconditional HTTP->HTTPS redirect on each Gateway's plaintext listener. No hostname, so they
# inherit the listener's *.z7x.org; the annotation keeps external-dns from publishing that
# wildcard (both instances filter on it).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: internal-https-redirect
  namespace: network
  annotations:
    dns.z7x.org/publish: "false"
spec:
  parentRefs:
    - name: internal
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-https-redirect
  namespace: network
  annotations:
    dns.z7x.org/publish: "false"
spec:
  parentRefs:
    - name: external
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
