# Fully public: the whole theme catalog (index.json, theme zips, preview images) is meant to be
# fetched by Fire TV devices anywhere, so this route is on the external gateway only.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: theme-catalog
spec:
  parentRefs:
    - name: external
      namespace: network
      sectionName: https
  hostnames:
    - themes.z7x.org
  rules:
    - backendRefs:
        - name: theme-catalog
          port: 8088
