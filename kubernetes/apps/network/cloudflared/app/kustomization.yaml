apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./deployment.yaml
  - ./secret.sops.yaml
# Hashed name: a config change rolls the pods (cloudflared doesn't reload its config file).
configMapGenerator:
  - name: cloudflared-config
    namespace: network
    files:
      - config.yaml
