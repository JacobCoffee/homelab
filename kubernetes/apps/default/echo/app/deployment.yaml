# Smoke-test target for the internal Gateway + external-dns-adguard + cert-manager wiring.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: echo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echo
    spec:
      containers:
        - name: echo
          image: mendhak/http-https-echo:43
          ports:
            - name: http
              containerPort: 8080
