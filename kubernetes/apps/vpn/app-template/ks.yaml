# Shared chart source for the bjw-s app-template HelmRelease under vpn/. One pull, reused via
# chartRef (same namespace, no values here).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vpn-app-template
  namespace: flux-system
spec:
  targetNamespace: vpn
  path: ./kubernetes/apps/vpn/app-template/app
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
