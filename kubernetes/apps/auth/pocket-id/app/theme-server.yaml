# Serves theme/ (lab.css and its fonts) at id.z7x.org/_lab/ for the stylesheet that
# envoyextensionpolicy.yaml links into Pocket ID's pages. Same origin as Pocket ID on purpose: its
# CSP only allows fonts from 'self'. The files come from the configMapGenerator in
# kustomization.yaml, so editing theme/ rolls this Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-id-theme
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pocket-id-theme
  template:
    metadata:
      labels:
        app: pocket-id-theme
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: caddy:2-alpine
          command: ["caddy", "run", "--adapter", "caddyfile", "--config", "/etc/caddy/Caddyfile"]
          env:
            - name: XDG_CONFIG_HOME
              value: /tmp
            - name: XDG_DATA_HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 8088
          readinessProbe:
            httpGet:
              path: /_lab/lab.css
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              # the caddy binary carries cap_net_bind_service; exec fails without it (see
              # network/theme-catalog), even though 8088 doesn't need it
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: theme
              mountPath: /srv
              readOnly: true
            - name: caddyfile
              mountPath: /etc/caddy
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: theme
          configMap:
            name: pocket-id-theme
        - name: caddyfile
          configMap:
            name: pocket-id-theme-caddy
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pocket-id-theme
spec:
  selector:
    app: pocket-id-theme
  ports:
    - name: http
      port: 8088
      targetPort: http
