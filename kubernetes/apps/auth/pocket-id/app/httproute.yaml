# id.z7x.org on both gateways. Public because Jellyfin's browser sign-in from outside (and any
# device off the tailnet) needs the issuer. Safe to publish: sign-in is passkey-only, signups are
# disabled, and /setup is closed (scripts/pocket-id.py created the owner, so it answers 409).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pocket-id-internal
spec:
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  hostnames:
    - id.z7x.org
  rules:
    - backendRefs:
        - name: pocket-id
          port: 1411
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pocket-id-external
spec:
  parentRefs:
    - name: external
      namespace: network
      sectionName: https
  hostnames:
    - id.z7x.org
  rules:
    - backendRefs:
        - name: pocket-id
          port: 1411
