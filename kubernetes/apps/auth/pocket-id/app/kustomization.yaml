apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./secret.sops.yaml
  - ./httproute.yaml
  - ./theme-server.yaml
  - ./envoyextensionpolicy.yaml
configMapGenerator:
  - name: pocket-id-theme
    files:
      - ./theme/lab.css
      - ./theme/background-still.svg
      - ./theme/hubot-sans-expanded-bold.woff2
      - ./theme/mona-sans.woff2
      - ./theme/departure-mono.woff2
  - name: pocket-id-theme-caddy
    files:
      - ./Caddyfile
components:
  - ../../../../components/volsync
