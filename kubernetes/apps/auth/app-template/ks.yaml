# Shared chart source for the bjw-s app-template HelmReleases under auth/ (same pattern as status/).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: auth-app-template
  namespace: flux-system
spec:
  targetNamespace: auth
  path: ./kubernetes/apps/auth/app-template/app
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
