# Nightly: fetch config.xml from each OPNsense firewall's core backup API (hnfw01/hnfw02, on their
# own K8S-zone addresses: same subnet as the nodes, so no asymmetric route through the CARP
# master; see ansible/README.md#opnsense), then restic-backup both to R2 (repo
# s3://homelab-backups/opnsense, see secret.sops.yaml).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: opnsense-backup
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          initContainers:
            - name: fetch
              image: curlimages/curl:8.11.1
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  for host in $OPNSENSE_HOSTS; do
                    curl -fsSk -u "$OPNSENSE_API_KEY:$OPNSENSE_API_SECRET" \
                      "https://$host/api/core/backup/download/this" -o "/backup/config-$host.xml"
                  done
              env:
                - name: OPNSENSE_HOSTS
                  value: "10.10.30.2 10.10.30.3"
              envFrom:
                - secretRef:
                    name: opnsense-backup-restic
              volumeMounts:
                - mountPath: /backup
                  name: backup
          containers:
            - name: restic
              image: restic/restic:0.19.1
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  restic snapshots >/dev/null 2>&1 || restic init
                  restic backup /backup --tag opnsense --host opnsense-backup
                  restic forget --prune --keep-daily 7 --keep-weekly 4
              envFrom:
                - secretRef:
                    name: opnsense-backup-restic
              volumeMounts:
                - mountPath: /backup
                  name: backup
          volumes:
            - name: backup
              emptyDir: {}
