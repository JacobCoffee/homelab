# Talos API access from Kubernetes (enabled cluster-wide by the KubeTalosAPIAccessConfig
# document in ../../../talos/patches/cluster.yaml, restricted to role os:etcd:backup and this
# namespace). Applying this CR makes a same-named Secret available, containing a short-lived
# talosconfig that talosctl in the CronJob mounts at /var/run/secrets/talos.dev.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-backup-talos
spec:
  roles:
    - os:etcd:backup
