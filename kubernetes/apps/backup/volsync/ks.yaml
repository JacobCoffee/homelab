# VolSync controller + CRDs: ReplicationSource/ReplicationDestination objects used by the
# reusable component at ../../../components/volsync (restic to R2) and included per-app by
# apps that want their config PVC backed up offsite.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: volsync
  namespace: flux-system
spec:
  targetNamespace: backup
  path: ./kubernetes/apps/backup/volsync/app
  prune: true
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: volsync
      namespace: backup
