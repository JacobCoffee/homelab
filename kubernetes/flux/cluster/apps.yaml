# Top-level Flux Kustomization that reconciles everything under kubernetes/apps. Lives next to the
# flux-system/ directory that `flux bootstrap` writes, but is hand-authored (bootstrap only writes
# flux-system/, it does not create this object).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  path: ./kubernetes/apps
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  # Every app Kustomization gets one patch for its HelmReleases: a failed install keeps retrying,
  # and a failed upgrade rolls back to the last good release instead of staying broken. Renovate
  # merges image/chart updates on its own (.github/renovate.json5), so this is the safety net.
  # Child Kustomizations must not set spec.patches themselves: this replaces that list.
  patches:
    - target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-used
        spec:
          patches:
            - target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
              patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: not-used
                spec:
                  install:
                    remediation:
                      retries: -1
                  upgrade:
                    cleanupOnFail: true
                    remediation:
                      retries: 3
                      strategy: rollback
