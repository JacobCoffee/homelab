# Cluster policy applied to every node (control planes and workers), Talos 1.14 multi-document
# config. Control planes also get controlplane.yaml. Per-node network, VIP, hostname and
# installer image come from ansible/roles/talos/templates/machine.yaml.j2, applied last.

# The default control plane node config taints it NoSchedule and keeps it out of
# LoadBalancer announcements; every node here runs workloads, so it is deleted and the
# per-node patch adds a fresh one (a merge can't drop map keys).
apiVersion: v1alpha1
kind: KubeNodeConfig
$patch: delete
---
# Serving certs via CSR (approved by kubelet-csr-approver) so metrics-server verifies TLS.
apiVersion: v1alpha1
kind: KubeletConfig
config:
  serverTLSBootstrap: true
---
# Cilium replaces Flannel and kube-proxy (installed right after bootstrap; kube-proxy is off in
# controlplane.yaml).
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
# Spegel (peer-to-peer image cache) needs containerd to keep unpacked layers.
apiVersion: v1alpha1
kind: CRICustomizationConfig
name: spegel
content: |
  [plugins."io.containerd.cri.v1.images"]
    discard_unpacked_layers = false
---
# Service logs (machined, kubelet, containerd, etc.) pushed as json_lines to the Alloy DaemonSet
# pod on this same node (kubernetes/apps/observability/alloy: hostNetwork: true, so 127.0.0.1
# reaches it from the host). Alloy receives it on otelcol.receiver.tcplog and tags it
# job="talos-service-logs" before forwarding to Loki. This is a strategic-merge patch against the
# base v1alpha1 config document (no apiVersion/kind -- machine.logging isn't its own typed
# document).
machine:
  logging:
    destinations:
      - endpoint: "tcp://127.0.0.1:6051/"
        format: json_lines
---
# Kernel (kmsg) log forwarding is its own typed document in 1.14+, to a second Alloy listener
# (job="talos-kernel-logs") so it stays distinguishable from service logs in Loki. Takes effect
# after a reboot.
apiVersion: v1alpha1
kind: KmsgLogConfig
name: alloy
url: tcp://127.0.0.1:6052/
