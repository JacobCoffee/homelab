# R2/restic credentials for ${APP}'s ReplicationSource (see replicationsource.yaml). The
# R2_*/VOLSYNC_RESTIC_PASSWORD values come from ../../apps/backup/cluster-secrets.sops.yaml and
# ../../flux/cluster/cluster-settings.yaml -- the including app's ks.yaml must list both in
# postBuild.substituteFrom alongside its own vars, or these are left as literal "${...}" strings.
apiVersion: v1
kind: Secret
metadata:
  name: ${APP}-volsync-restic
type: Opaque
stringData:
  RESTIC_REPOSITORY: s3:${R2_ENDPOINT}/${R2_BUCKET}/volsync/${APP}
  RESTIC_PASSWORD: ${VOLSYNC_RESTIC_PASSWORD}
  AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
